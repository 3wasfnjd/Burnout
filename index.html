const player=new THREE.Group();scene.add(player);let model,mixer,baseY=0,bones,walkT=0;const axis=new THREE.Vector3(1,0,0),qq=new THREE.Quaternion();function bonesOf(r){const b={};r.traverse(o=>{if(!o.isBone)return;const n=o.name.toLowerCase().replace(/[^a-z]/g,'');if(/leftupleg/.test(n))b.lu=o;if(/rightupleg/.test(n))b.ru=o;if(!/up/.test(n)&&/leftleg/.test(n))b.ll=o;if(!/up/.test(n)&&/rightleg/.test(n))b.rl=o});return b}function bx(b,a){if(b){qq.setFromAxisAngle(axis,a);b.quaternion.multiply(qq)}}function walk(s){if(!bones)return;const p=Math.sin(walkT),k=Math.min(1,s/2.5);bx(bones.lu,p*.36*k);bx(bones.ru,-p*.36*k);bx(bones.ll,Math.max(0,-p)*.24*k);bx(bones.rl,Math.max(0,p)*.24*k);model.position.y=baseY+Math.abs(p)*.02*k}const fbx=new FBXLoader();Promise.all([fbx.loadAsync('./assets/kenney/characterMedium.fbx'),fbx.loadAsync('./assets/kenney/idle.fbx'),new THREE.TextureLoader().loadAsync('./assets/kenney/humanMaleA.png')]).then(([o,idle,t])=>{t.colorSpace=THREE.SRGBColorSpace;t.flipY=true;o.updateMatrixWorld(true);let b=new THREE.Box3().setFromObject(o),sz=b.getSize(new THREE.Vector3());o.scale.setScalar(1.78/sz.y);o.updateMatrixWorld(true);b=new THREE.Box3().setFromObject(o);const c=b.getCenter(new THREE.Vector3());o.position.x-=c.x;o.position.y-=b.min.y;o.position.z-=c.z;o.traverse(n=>{if(n.isMesh){n.castShadow=n.receiveShadow=true;n.material=new THREE.MeshStandardMaterial({map:t,roughness:.82})}});model=o;player.add(o);baseY=o.position.y;bones=bonesOf(o);mixer=new THREE.AnimationMixer(o);if(idle.animations[0])mixer.clipAction(idle.animations[0],o).play()});
let keys={l:0,r:0,u:0,d:0},jx=0,jy=0;function press(e,v){const k=e.key.toLowerCase();if(k==='a'||k==='arrowleft')keys.l=v;if(k==='d'||k==='arrowright')keys.r=v;if(k==='w'||k==='arrowup')keys.u=v;if(k==='s'||k==='arrowdown')keys.d=v;if(v&&k==='e')go(1)}addEventListener('keydown',e=>press(e,1));addEventListener('keyup',e=>press(e,0));const joy=document.getElementById('joy'),knob=document.getElementById('knob');let pid;function jm(e){const r=joy.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=38,l=Math.hypot(x,y)||1,k=Math.min(1,m/l);jx=x*k/m;jy=y*k/m;knob.style.transform=`translate(${x*k}px,${y*k}px)`}joy.onpointerdown=e=>{pid=e.pointerId;joy.setPointerCapture(pid);jm(e)};joy.onpointermove=e=>{if(e.pointerId===pid)jm(e)};joy.onpointerup=joy.onpointercancel=e=>{pid=null;jx=jy=0;knob.style.transform='none'};function go(d){roomIndex=THREE.MathUtils.clamp(roomIndex+d,0,rooms.length-1);buildRoom(roomIndex)}document.getElementById('next').onclick=()=>go(1);document.getElementById('prev').onclick=()=>go(-1);buildRoom(0);
