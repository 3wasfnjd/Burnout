const player=new THREE.Group();player.position.set(-.25,.12,.55);scene.add(player);let model,mixer,bones,baseY=0,walkT=0;const axis=new THREE.Vector3(1,0,0),qq=new THREE.Quaternion();function findBones(r){let b={};r.traverse(o=>{if(!o.isBone)return;let n=o.name.toLowerCase().replace(/[^a-z]/g,'');if(!b.lu&&/leftupleg|leftthigh/.test(n))b.lu=o;if(!b.ru&&/rightupleg|rightthigh/.test(n))b.ru=o;if(!b.ll&&!/up|thigh/.test(n)&&/leftleg|leftcalf/.test(n))b.ll=o;if(!b.rl&&!/up|thigh/.test(n)&&/rightleg|rightcalf/.test(n))b.rl=o});return b}function bx(b,a){if(b){qq.setFromAxisAngle(axis,a);b.quaternion.multiply(qq)}}function walk(s){if(!bones)return;let p=Math.sin(walkT),k=Math.min(1,s/2.5);bx(bones.lu,p*.38*k);bx(bones.ru,-p*.38*k);bx(bones.ll,Math.max(0,-p)*.26*k);bx(bones.rl,Math.max(0,p)*.26*k);model.position.y=baseY+Math.abs(p)*.022*k}const fbx=new FBXLoader();Promise.all([fbx.loadAsync('./assets/kenney/characterMedium.fbx'),fbx.loadAsync('./assets/kenney/idle.fbx'),new THREE.TextureLoader().loadAsync('./assets/kenney/humanMaleA.png')]).then(([o,idle,t])=>{t.colorSpace=THREE.SRGBColorSpace;t.flipY=true;o.updateMatrixWorld(true);let b=new THREE.Box3().setFromObject(o),sz=b.getSize(new THREE.Vector3());o.scale.setScalar(2.25/sz.y);o.updateMatrixWorld(true);b=new THREE.Box3().setFromObject(o);let c=b.getCenter(new THREE.Vector3());o.position.x-=c.x;o.position.y-=b.min.y;o.position.z-=c.z;o.traverse(x=>{if(x.isMesh){x.castShadow=x.receiveShadow=true;x.material=new THREE.MeshStandardMaterial({map:t,roughness:.82})}});model=o;player.add(o);baseY=o.position.y;bones=findBones(o);mixer=new THREE.AnimationMixer(o);if(idle.animations[0])mixer.clipAction(idle.animations[0],o).play()});
const status=document.getElementById('status'),prompt=document.getElementById('prompt'),promptText=document.getElementById('promptText'),roomLabel=document.getElementById('roomLabel');function setStatus(t,c=''){status.textContent=t;status.className='status '+c}let keys={u:0,d:0,l:0,r:0},jx=0,jy=0,activeRoom=1,interaction=null,unlocked1=false,unlocked2=false,pseq=[],vseq=[],vturn=[0,0,0],vtarget=[0,0,0];function press(e,v){let k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.u=v;if(k==='s'||k==='arrowdown')keys.d=v;if(k==='a'||k==='arrowleft')keys.l=v;if(k==='d'||k==='arrowright')keys.r=v;if(v&&(k==='e'||k==='enter'))interact()}addEventListener('keydown',e=>press(e,1));addEventListener('keyup',e=>press(e,0));let joy=document.getElementById('joy'),knob=document.getElementById('knob'),pid;function jm(e){let r=joy.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=38,l=Math.hypot(x,y)||1,k=l>m?m/l:1;jx=x*k/m;jy=y*k/m;knob.style.transform=`translate(${x*k}px,${y*k}px)`}joy.onpointerdown=e=>{pid=e.pointerId;joy.setPointerCapture(pid);jm(e)};joy.onpointermove=e=>{if(e.pointerId===pid)jm(e)};joy.onpointerup=e=>{pid=null;jx=jy=0;knob.style.transform='none'};document.getElementById('useBtn').onclick=interact;function flash(o,c){let old=o.material.emissive.getHex();o.material.emissive.setHex(c);o.material.emissiveIntensity=1.7;setTimeout(()=>{o.material.emissive.setHex(old);o.material.emissiveIntensity=.2},250)}function interact(){if(!interaction)return;if(interaction.k==='p'){let id=interaction.i,ex=[2,1,3];pseq.push(id);if(id!==ex[pseq.length-1]){pseq=[];flash(interaction.o,0xaa3025);setStatus('ترتيب غير صحيح','bad')}else{flash(interaction.o,0x369451);setStatus(`إشارة صحيحة ${pseq.length}/3`,'good');if(pseq.length===3){unlocked1=true;panelLamp.material.emissive.setHex(0x36a657);setStatus('تم فتح الباب — اتجه إليه','good')}}}else if(interaction.k==='door'){activeRoom=2;player.position.set(-5.7,room2Y+.2,1.6);controls.target.y=room2Y+1.8;ro const clock=new THREE.Clock(),vel=new THREE.Vector3(),tar=new THREE.Vector3();function anim(){requestAnimationFrame(anim);let dt=Math.min(clock.getDelta(),.033),x=keys.r-keys.l+jx,z=keys.d-keys.u+jy;tar.set(x,0,z);if(tar.lengthSq()>1)tar.normalize();tar.multiplyScalar(2.75);vel.lerp(tar,1-Math.exp(-9*dt));player.position.addScaledVector(vel,dt);player.position.x=THREE.MathUtils.clamp(player.position.x,-6.6,6.7);player.position.z=THREE.MathUtils.clamp(player.position.z,-2.35,2.75);player.position.y=activeRoom===1?.12:room2Y+.2;let s=vel.length();if(mixer)mixer.update(dt);if(s>.12){let t=Math.atan2(vel.x,vel.z),d=Math.atan2(Math.sin(t-player.rotation.y),Math.cos(t-player.rotation.y));player.rotation.y+=d*(1-Math.exp(-12*dt));walkT+=dt*(6.4+s*.7);walk(s)}for(let i=0;i<3;i++){vturn[i]=THREE.MathUtils.lerp(vturn[i],vtarget[i],1-Math.exp(-9*dt));valveMeshes[i].rotation.z=vturn[i]}nearest();if(unlocked1&&door1.position.y<4.85)door1.position.y+=dt*2.15;if(unlocked2&&door2.position.y<room2Y+4.95)door2.position.y+=dt*2.15;controls.update();renderer.render(scene,camera)}anim();addEventListener('resize',()=>{fit();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
