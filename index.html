<div id="hud"><div class="title"><b>THE SHELTER</b><span>غرفة واحدة — ديوراما ثلاثية الأبعاد</span></div><div id="interact">اضغط E للتفاعل</div><div id="hint">WASD / الأسهم للحركة الحرة — اقترب من لوحة الباب</div><div id="mobile"><div class="joystick" id="joystick"><div class="joyknob" id="joyknob"></div></div><button class="use" id="useBtn">تفاعل</button></div></div>
