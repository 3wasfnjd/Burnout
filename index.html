const player=new THREE.Group();player.position.set(0,8.18,.5);scene.add(player);let model,mixer,baseY=0,bones,walkT=0;const axis=new THREE.Vector3(1,0,0),qq=new THREE.Quaternion();function bonesOf(r){const b={};r.traverse(o=>{if(!o.isBone)return;const n=o.name.toLowerCase().replace(/[^a-z]/g,'');if(/leftupleg/.test(n))b.lu=o;if(/rightupleg/.test(n))b.ru=o;if(!/up/.test(n)&&/leftleg/.test(n))b.ll=o;if(!/up/.test(n)&&/rightleg/.test(n))b.rl=o});return b}function bx(b,a){if(b){qq.setFromAxisAngle(axis,a);b.quaternion.multiply(qq)}}function walk(s){if(!bones)return;const p=Math.sin(walkT),k=Math.min(1,s/2.5);bx(bones.lu,p*.35*k);bx(bones.ru,-p*.35*k);bx(bones.ll,Math.max(0,-p)*.22*k);bx(bones.rl,Math.max(0,p)*.22*k);model.position.y=baseY+Math.abs(p)*.02*k}const fbx=new FBXLoader();Promise.all([fbx.loadAsync('./assets/kenney/characterMedium.fbx'),fbx.loadAsync('./assets/kenney/idle.fbx'),new THREE.TextureLoader().loadAsync('./assets/kenney/humanMaleA.png')]).then(([o,idle,t])=>{t.colorSpace=THREE.SRGBColorSpace;t.flipY=true;o.updateMatrixWorld(true);let b=new THREE.Box3().setFromObject(o),sz=b.getSize(new THREE.Vector3());o.scale.setScalar(1.85/sz.y);o.updateMatrixWorld(true);b=new THREE.Box3().setFromObject(o);const c=b.getCenter(new THREE.Vector3());o.position.x-=c.x;o.position.y-=b.min.y;o.position.z-=c.z;o.traverse(n=>{if(n.isMesh){n.castShadow=n.receiveShadow=true;n.material=new THREE.MeshStandardMaterial({map:t,roughness:.82})}});model=o;player.add(o);baseY=o.position.y;bones=bonesOf(o);mixer=new THREE.AnimationMixer(o);if(idle.animations[0])mixer.clipAction(idle.animations[0],o).play()});
let current=0,keys={l:0,r:0,u:0,d:0},jx=0,jy=0;const roomName=document.getElementById('roomName'),prompt=document.getElementById('prompt');const links=[[0,1,-4.2],[0,2,4.2],[0,6,0],[1,3,4.2],[2,3,-4.2],[2,4,4.2],[6,5,-4.2],[6,7,4.2],[1,5,-4.2],[7,4,4.2],[3,9,4.2],[5,8,4.2]];let nearLink=null;function roomIndex(id){return rooms.findIndex(r=>r===id)}function updateLink(){nearLink=null;for(const [a,b,edge]of links){if(current!==a&&current!==b)continue;const r=rooms[current];const target=current===a?b:a;if(Math.abs(player.position.x-(r.x+edge))<1.05){nearLink=target;break}}prompt.classList.toggle('show',nearLink!==null)}function travel(){if(nearLink===null)return;current=nearLink;const r=rooms[current];player.position.set(r.x,r.y+.18,.5);roomName.textContent=r.id+' · '+r.name}function press(e,v){const k=e.key.toLowerCase();if(k==='a'||k==='arrowleft')keys.l=v;if(k==='d'||k==='arrowright')keys.r=v;if(k==='w'||k==='arrowup')keys.u=v;if(k==='s'||k==='arrowdown')keys.d=v;if(v&&(k==='e'||k==='enter'))travel()}addEventListener('keydown',e=>press(e,1));addEventListener('keyup',e=>press(e,0));document.getElementById('use').onclick=travel;const joy=document.getElementById('joy'),knob=document.getElementById('knob');let pid;function jm(e){const r=joy.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=38,l=Math.hypot(x,y)||1,k=Math.min(1,m/l);jx=x*k/m;jy=y*k/m;knob.style.transform=`translate(${x*k}px,${y*k}px)`}joy.onpointerdown=e=>{pid=e.pointerId;joy.setPointerCapture(pid);jm(e)};joy.onpointermove=e=>{if(e.pointerId===pid)jm(e)};joy.onpointerup=e=>{pid=null;jx=jy=0;knob.style.transform='none'};
const clock=new THREE.Clock(),vel=new THREE.Vector3();function animate(){requestAnimationFrame(animate);const dt=Math.min(.033,clock.getDelta()),r=rooms[current],dx=keys.r-keys.l+jx,dz=keys.d-keys.u+jy;vel.x=THREE.MathUtils.lerp(vel.x,dx*2.4,1-Math.exp(-9*dt));vel.z=THREE.MathUtils.lerp(vel.z,dz*2.1,1-Math.exp(-9*dt));player.position.x+=vel.x*dt;player.position.z+=vel.z*dt;player.position.x=THREE.MathUtils.clamp(player.position.x,r.x-r.w/2+.6,r.x+r.w/2-.6);player.position.z=THREE.MathUtils.clamp(player.position.z,-2.1,2.25);player.position.y=r.y+.18;const s=vel.length();if(mixer)mixer.update(dt);if(s>.12&&model){player.rotation.y=THREE.MathUtils.lerp(player.rotation.y,Math.atan2(vel.x,vel.z),.18);walkT+=dt*7;walk(s)}else if(model)model.position.y=THREE.MathUtils.lerp(model.position.y,baseY,.2);updateLink();renderer.render(scene,camera)}animate();addEventListener('resize',()=>{fit();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
