<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>The Shelter</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0d0d;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}canvas{display:block;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;color:#eee7da}.brand{position:absolute;top:16px;right:18px;padding:10px 13px;background:#151513aa;border:1px solid #ffffff17;border-radius:14px;backdrop-filter:blur(8px);font-size:11px}.brand b{display:block;font-size:15px;letter-spacing:.12em}.brand span{opacity:.72}
#prompt{position:absolute;left:72%;top:45%;transform:translate(-50%,-50%);opacity:0;transition:.18s;background:#171614db;border:1px solid #ffffff22;border-radius:10px;padding:8px 12px;font-size:13px;white-space:nowrap}.key{display:inline-grid;place-items:center;width:28px;height:28px;margin-left:7px;background:#eee;color:#171717;border-radius:5px;font-weight:800;text-shadow:none}#prompt.show{opacity:1}
#mobile{position:absolute;inset:0;pointer-events:none}.joystick{position:absolute;left:22px;bottom:24px;width:132px;height:132px;border:2px solid #ffffff25;border-radius:50%;background:#1113189c;pointer-events:auto;touch-action:none}.knob{position:absolute;width:52px;height:52px;left:38px;top:38px;border-radius:50%;background:#8c8d8ca8;border:1px solid #ffffff3d;box-shadow:0 4px 18px #0008}.use{position:absolute;right:24px;bottom:35px;width:76px;height:76px;border-radius:50%;pointer-events:auto;border:2px solid #ffffff25;background:#1113189c;color:#fff;font-size:24px;touch-action:none}
#modal{position:fixed;inset:0;display:none;place-items:center;background:#070808d9;padding:22px;z-index:20}.card{width:min(420px,92vw);padding:24px;border-radius:20px;background:#ddd3bc;color:#27241f;text-align:center;box-shadow:0 28px 80px #000c}.symbols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.sym{border:0;border-radius:14px;background:#beb29b;padding:18px 0;font-size:25px}.close{border:0;border-radius:12px;padding:10px 18px;background:#30312d;color:#fff;font-weight:700}#msg{min-height:23px;font-weight:700;color:#685235}
@media(min-width:900px){#mobile{display:none}}@media(max-width:600px){.brand span{display:none}#prompt{left:65%;top:43%}}
</style>
</head>
<body>
<div id="hud"><div class="brand"><b>THE SHELTER</b><span>Underground Room 01</span></div><div id="prompt"><span class="key">E</span> تفاعل</div><div id="mobile"><div class="joystick" id="joy"><div class="knob" id="knob"></div></div><button class="use" id="useBtn">↟</button></div></div>
<div id="modal"><div class="card"><h2>لوحة الطوارئ</h2><p>اختر الرموز بالترتيب الصحيح.</p><div class="symbols"><button class="sym" data-v="1">●</button><button class="sym" data-v="2">▲</button><button class="sym" data-v="3">■</button></div><div id="msg">التلميح: ▲ ● ■</div><br><button id="closeBtn" class="close">إغلاق</button></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const scene=new THREE.Scene();scene.background=new THREE.Color(0x090b0b);scene.fog=new THREE.Fog(0x090b0b,20,42);
const camera=new THREE.PerspectiveCamera(29,innerWidth/innerHeight,.1,100);camera.position.set(10.8,9.7,13.8);camera.lookAt(0,1.4,-.2);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.88;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x8c877a,0x090909,.72));const moon=new THREE.DirectionalLight(0xb9c3b1,.7);moon.position.set(-6,9,8);moon.castShadow=true;moon.shadow.mapSize.set(2048,2048);scene.add(moon);
const mat=(c,r=1,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const M={concrete:mat(0x544b40,.98),concrete2:mat(0x675b4d,1),floor:mat(0x665b4c,.93),rock:mat(0x272622,1),rock2:mat(0x39342c,1),wood:mat(0x573b28,1),wood2:mat(0x37271d,1),metal:mat(0x3d4543,.72,.35),dark:mat(0x181b1a,.9,.2),rust:mat(0x634432,1),green:mat(0x354339,1),cloth:mat(0x4d4b39,1),red:mat(0x8c372d,1),skin:mat(0xc28d69,1),hair:mat(0x2a201c,1),paper:mat(0xb8a98d,1),glow:new THREE.MeshStandardMaterial({color:0xffd092,emissive:0xff9e45,emissiveIntensity:3})};
function box(w,h,d,ma,x,y,z,ry=0){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),ma);o.position.set(x,y,z);o.rotation.y=ry;o.castShadow=o.receiveShadow=true;scene.add(o);return o}
function cyl(r,h,ma,x,y,z,rz=0){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,12),ma);o.position.set(x,y,z);o.rotation.z=rz;o.castShadow=o.receiveShadow=true;scene.add(o);return o}
function rock(x,y,z,s){const o=new THREE.Mesh(new THREE.DodecahedronGeometry(s,0),Math.random()>.5?M.rock:M.rock2);o.position.set(x,y,z);o.scale.set(1.25,.7,1);o.rotation.set(Math.random(),Math.random()*3,Math.random());o.castShadow=true;scene.add(o)}
function warmLamp(x,y,z,power=7){const bulb=new THREE.Mesh(new THREE.SphereGeometry(.11,10,8),M.glow);bulb.position.set(x,y,z);scene.add(bulb);const l=new THREE.PointLight(0xffa64d,power,6,2);l.position.copy(bulb.position);l.castShadow=true;scene.add(l)}

// Cutaway diorama shell
box(17.4,.55,9,M.rock,0,-.42,.15);box(17.2,5.7,.75,M.rock,0,2.33,-4.02);box(.8,5.7,9,M.rock,-8.25,2.33,.15);box(.8,5.7,9,M.rock,8.25,2.33,.15);
box(15.6,.28,7.5,M.floor,0,-.08,.12);box(15.5,5.05,.34,M.concrete,0,2.32,-3.55);box(.34,5.05,7.4,M.concrete2,-7.55,2.32,.1);box(.34,5.05,7.4,M.concrete2,7.55,2.32,.1);
for(let i=0;i<34;i++)rock(-8+Math.random()*16,5+Math.random()*.65,-3.75+(Math.random()-.5)*.7,.24+Math.random()*.42);for(let i=0;i<18;i++){rock(-8,.1+Math.random()*4.7,-3.3+Math.random()*6.8,.22+Math.random()*.32);rock(8,.1+Math.random()*4.7,-3.3+Math.random()*6.8,.22+Math.random()*.32)}for(let i=0;i<24;i++)rock(-7.7+Math.random()*15.4,-.05,3.55+(Math.random()-.5)*.7,.18+Math.random()*.3);

// floor slabs
for(let x=-6.8;x<7;x+=1.45)for(let z=-2.7;z<3.2;z+=1.35){const slab=box(1.38,.035,1.28,Math.random()>.55?M.floor:M.concrete2,x,.1,z,(Math.random()-.5)*.018);slab.position.y=.09}

// Door and control panel on right
box(3.1,4.1,.46,M.dark,5.45,1.86,-3.25);const door=box(2.42,3.46,.28,M.metal,5.45,1.62,-2.97);for(let y=.35;y<3.2;y+=.65)box(1.95,.06,.05,M.dark,5.45,y,-2.79);const ring=new THREE.Mesh(new THREE.TorusGeometry(.31,.08,8,16),M.rust);ring.position.set(5.45,1.75,-2.78);scene.add(ring);box(.72,1.05,.28,M.dark,3.82,1.42,-2.94);box(.4,.23,.07,new THREE.MeshStandardMaterial({color:0x5b8f65,emissive:0x2e6f44,emissiveIntensity:1.4}),3.82,1.66,-2.76);warmLamp(5.45,4.02,-2.4,9);

// bed left foreground
box(3.05,.32,1.5,M.wood2,-5.25,.28,1.25);box(2.88,.2,1.38,M.cloth,-5.25,.56,1.25);box(.82,.2,1.1,M.paper,-6.15,.76,1.25);box(.16,1.2,.16,M.wood,-6.66,.56,.68);box(.16,1.2,.16,M.wood,-6.66,.56,1.82);box(.16,.82,.16,M.wood,-3.85,.39,.68);box(.16,.82,.16,M.wood,-3.85,.39,1.82);

// work desk and shelves back left
box(3.15,.24,1.1,M.wood,-4.35,1.02,-2.55);box(.2,1.05,.2,M.wood2,-5.6,.45,-2.55);box(.2,1.05,.2,M.wood2,-3.1,.45,-2.55);box(.72,.8,.65,M.wood2,-3.25,.52,-2.48);box(.7,.1,.42,M.paper,-4.35,1.22,-2.22,-.12);warmLamp(-4.95,1.65,-2.2,5);
box(3.2,.14,.62,M.wood,-5.0,2.24,-3.03);box(3.2,.14,.62,M.wood,-5.0,3.03,-3.03);box(.13,2.15,.13,M.wood2,-6.4,2.18,-3.03);box(.13,2.15,.13,M.wood2,-3.6,2.18,-3.03);for(let i=0;i<8;i++)box(.18+Math.random()*.2,.45+Math.random()*.38,.32,M.paper,-6.05+i*.37,2.55,-2.75,(Math.random()-.5)*.15);

// central lockers and crates
box(1.48,3.0,.75,M.metal,-1.48,1.55,-3.0);box(.68,2.78,.08,M.dark,-1.82,1.55,-2.59);box(.68,2.78,.08,M.dark,-1.12,1.55,-2.59);box(1.0,.75,.9,M.green,.65,.48,-2.75);box(.9,.58,.82,M.wood,2.0,.39,-2.75);

// pipes / valves
cyl(.25,4.0,M.rust,1.45,3.45,-3.05,0);cyl(.12,2.2,M.rust,2.55,3.5,-3.0,0);cyl(.12,2.4,M.rust,3.05,3.45,-3.0,0);cyl(.12,4.6,M.rust,-.35,4.28,-3.05,Math.PI/2);for(const x of [1.45,2.55,3.05]){const v=new THREE.Mesh(new THREE.TorusGeometry(.25,.055,6,12),M.rust);v.position.set(x,2.7,-2.73);v.rotation.x=Math.PI/2;scene.add(v)}

// rug, table, clutter foreground
box(4.2,.035,2.45,mat(0x654532,1),-.9,.13,.82,-.04);box(1.55,.5,1.0,M.wood,4.72,.3,2.65);box(.65,.5,.65,M.green,5.8,.34,2.48);warmLamp(4.65,.82,2.65,4);for(let i=0;i<18;i++)rock(-6.8+Math.random()*13.4,.15,2.7+Math.random()*.6,.055+Math.random()*.1);

// posters/papers on walls
for(const [x,y,s] of [[-6.7,3.1,.7],[-3.0,2.55,.36],[3.1,2.6,.38],[6.8,2.7,.5]]){const p=box(s,1.05*s,.025,M.paper,x,y,-3.34,(Math.random()-.5)*.05);p.rotation.z=(Math.random()-.5)*.08}

// plants
for(const [x,z] of [[-6.55,-1.9],[2.9,-2.4],[6.75,2.15]]){box(.45,.32,.45,M.wood,x,.27,z);for(let i=0;i<6;i++){const leaf=new THREE.Mesh(new THREE.ConeGeometry(.1,.6,5),M.green);leaf.position.set(x+(Math.random()-.5)*.24,.68,z+(Math.random()-.5)*.24);leaf.rotation.z=(Math.random()-.5)*.8;scene.add(leaf)}}

// player root: tries real character.glb, otherwise stylized red-shirt boy
const player=new THREE.Group();player.position.set(-.25,.12,.55);scene.add(player);let model=null,animMixer=null,walkClip=null,walkParts=null;
function fallbackBoy(){const g=new THREE.Group();const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.34,.72,4,8),M.red);torso.position.y=1.13;g.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.31,12,8),M.skin);head.position.y=1.96;g.add(head);const hair=new THREE.Mesh(new THREE.SphereGeometry(.32,10,7,0,Math.PI*2,0,Math.PI*.52),M.hair);hair.position.y=2.09;g.add(hair);const l1=new THREE.Mesh(new THREE.BoxGeometry(.2,.72,.24),M.dark),l2=l1.clone();l1.position.set(-.17,.39,0);l2.position.set(.17,.39,0);g.add(l1,l2);const a1=new THREE.Mesh(new THREE.CapsuleGeometry(.1,.5,3,6),M.skin),a2=a1.clone();a1.position.set(-.44,1.14,0);a2.position.set(.44,1.14,0);g.add(a1,a2);const backpack=box(.55,.7,.3,M.wood,0,0,0);scene.remove(backpack);backpack.position.set(0,1.22,.26);g.add(backpack);g.traverse(o=>{if(o.isMesh)o.castShadow=true});player.add(g);model=g;walkParts={l1,l2,a1,a2}}
fallbackBoy();
new GLTFLoader().load('./character.glb',g=>{player.clear();model=g.scene;const b=new THREE.Box3().setFromObject(model),size=b.getSize(new THREE.Vector3()),center=b.getCenter(new THREE.Vector3());const scale=2.25/Math.max(size.y,.001);model.scale.setScalar(scale);model.position.set(-center.x*scale,-b.min.y*scale,-center.z*scale);model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});player.add(model);if(g.animations?.length){animMixer=new THREE.AnimationMixer(model);walkClip=animMixer.clipAction(g.animations[0])}},undefined,()=>{});

const keys={up:false,down:false,left:false,right:false};let joyX=0,joyY=0,near=false,unlocked=false,puzzle=[],walkT=0;const prompt=document.getElementById('prompt'),modal=document.getElementById('modal'),msg=document.getElementById('msg');
function key(e,v){const k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.up=v;if(k==='s'||k==='arrowdown')keys.down=v;if(k==='a'||k==='arrowleft')keys.left=v;if(k==='d'||k==='arrowright')keys.right=v;if(v&&(k==='e'||k==='enter')&&near)openPuzzle()}addEventListener('keydown',e=>key(e,true));addEventListener('keyup',e=>key(e,false));
const joy=document.getElementById('joy'),knob=document.getElementById('knob');let pid=null;function moveJoy(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=39,l=Math.hypot(dx,dy)||1;if(l>max){dx*=max/l;dy*=max/l}joyX=dx/max;joyY=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`}joy.onpointerdown=e=>{pid=e.pointerId;joy.setPointerCapture(pid);moveJoy(e)};joy.onpointermove=e=>{if(e.pointerId===pid)moveJoy(e)};function endJoy(e){if(e.pointerId!==pid)return;pid=null;joyX=joyY=0;knob.style.transform='translate(0,0)'}joy.onpointerup=endJoy;joy.onpointercancel=endJoy;
document.getElementById('useBtn').onclick=()=>{if(near)openPuzzle()};document.getElementById('closeBtn').onclick=()=>modal.style.display='none';document.querySelectorAll('.sym').forEach(b=>b.onclick=()=>{puzzle.push(+b.dataset.v);if(puzzle.length===3){if(puzzle.join('')==='213'){unlocked=true;msg.textContent='تم فتح الباب';setTimeout(()=>modal.style.display='none',650)}else msg.textContent='ترتيب غير صحيح';puzzle=[]}});function openPuzzle(){msg.textContent=unlocked?'الباب مفتوح بالفعل':'التلميح: ▲ ● ■';modal.style.display='grid'}
const clock=new THREE.Clock(),dir=new THREE.Vector3(),camTarget=new THREE.Vector3();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.033);let x=(keys.right?1:0)-(keys.left?1:0)+joyX;let z=(keys.down?1:0)-(keys.up?1:0)+joyY;dir.set(x,0,z);const moving=dir.lengthSq()>.015;if(moving){dir.normalize();player.position.addScaledVector(dir,2.75*dt);player.position.x=THREE.MathUtils.clamp(player.position.x,-6.6,6.55);player.position.z=THREE.MathUtils.clamp(player.position.z,-2.35,2.85);const target=Math.atan2(dir.x,dir.z);let d=target-player.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));player.rotation.y+=d*Math.min(1,dt*12);walkT+=dt*8;if(walkParts){walkParts.l1.rotation.x=Math.sin(walkT)*.55;walkParts.l2.rotation.x=-Math.sin(walkT)*.55;walkParts.a1.rotation.x=-Math.sin(walkT)*.42;walkParts.a2.rotation.x=Math.sin(walkT)*.42}if(walkClip&&!walkClip.isRunning())walkClip.play()}else{if(walkParts){walkParts.l1.rotation.x*=.78;walkParts.l2.rotation.x*=.78;walkParts.a1.rotation.x*=.78;walkParts.a2.rotation.x*=.78}if(walkClip)walkClip.stop()}if(animMixer)animMixer.update(dt);near=Math.hypot(player.position.x-3.82,player.position.z+2.25)<1.35;prompt.classList.toggle('show',near);if(unlocked&&door.position.y<4.8)door.position.y+=dt*2.25;camTarget.set(player.position.x*.11,1.28,player.position.z*.07);camera.lookAt(camTarget);renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
