const gltf=new GLTFLoader();const Q='./assets/vendor/quaternius-scifi/Modular%20SciFi%20MegaKit%5BStandard%5D/glTF/';async function qprop(path,x,y,z,s=1,ry=0){try{const a=await gltf.loadAsync(Q+path),o=a.scene;o.position.set(x,y,z);o.scale.setScalar(s);o.rotation.y=ry;o.traverse(n=>{if(n.isMesh){n.castShadow=n.receiveShadow=true;if(n.material){n.material.roughness=Math.max(.55,n.material.roughness??.55)}}});scene.add(o);return o}catch(e){console.warn('Quaternius asset',path,e)}}Promise.all([qprop('Columns/Column_Pipes.gltf',3.15,.13,-2.45,.72,0),qprop('Columns/Column_MetalSupport.gltf',-2.7,.13,-2.5,.9,0),qprop('Columns/Column_MetalSupport_Curve.gltf',3.9,.13,-2.5,.8,0),qprop('Props/Prop_AccessPoint.gltf',4.25,.55,-2.35,.8,0),qprop('Props/Prop_Chest.gltf',5.7,.18,1.85,.75,-.18),qprop('Props/Prop_Barrel_Large.gltf',6.35,.18,2.25,.68,0),qprop('Props/Prop_Cable_1.gltf',-1.8,.16,-2.45,.85,0),qprop('Props/Prop_Cable_3.gltf',2.15,.16,-2.45,.72,0)]);

const player=new THREE.Group();player.position.set(-.4,.12,.65);scene.add(player);let model,mixer,baseY=0,bones,walkT=0;const axis=new THREE.Vector3(1,0,0),qq=new THREE.Quaternion();function bonesOf(r){const b={};r.traverse(o=>{if(!o.isBone)return;const n=o.name.toLowerCase().replace(/[^a-z]/g,'');if(/leftupleg/.test(n))b.lu=o;if(/rightupleg/.test(n))b.ru=o;if(!/up/.test(n)&&/leftleg/.test(n))b.ll=o;if(!/up/.test(n)&&/rightleg/.test(n))b.rl=o});return b}function bx(b,a){if(b){qq.setFromAxisAngle(axis,a);b.quaternion.multiply(qq)}}function walk(s){if(!bones)return;const p=Math.sin(walkT),k=Math.min(1,s/2.5);bx(bones.lu,p*.36*k);bx(bones.ru,-p*.36*k);bx(bones.ll,Math.max(0,-p)*.24*k);bx(bones.rl,Math.max(0,p)*.24*k);model.position.y=baseY+Math.abs(p)*.02*k}const fbx=new FBXLoader();Promise.all([fbx.loadAsync('./assets/kenney/characterMedium.fbx'),fbx.loadAsync('./assets/kenney/idle.fbx'),new THREE.TextureLoader().loadAsync('./assets/kenney/humanMaleA.png')]).then(([o,idle,t])=>{t.colorSpace=THREE.SRGBColorSpace;t.flipY=true;o.updateMatrixWorld(true);let b=new THREE.Box3().setFromObject(o),sz=b.getSize(new THREE.Vector3());o.scale.setScalar(2/sz.y);o.updateMatrixWorld(true);b=new THREE.Box3().setFromObject(o);const c=b.getCenter(new THREE.Vector3());o.position.x-=c.x;o.position.y-=b.min.y;o.position.z-=c.z;o.traverse(n=>{if(n.isMesh){n.castShadow=n.receiveShadow=true;n.material=new THREE.MeshStandardMaterial({map:t,roughness:.82})}});model=o;player.add(o);baseY=o.position.y;bones=bonesOf(o);mixer=new THREE.AnimationMixer(o);if(idle.animations[0])mixer.clipAction(idle.animations[0],o).play()});
let keys={l:0,r:0,u:0,d:0},jx=0,jy=0;function press(e,v){const k=e.key.toLowerCase();if(k==='a'||k==='arrowleft')keys.l=v;if(k==='d'||k==='arrowright')keys.r=v;if(k==='w'||k==='arrowup')keys.u=v;if(k==='s'||k==='arrowdown')keys.d=v}addEventListener('keydown',e=>press(e,1));addEventListener('keyup',e=>press(e,0));const joy=document.getElementById('joy'),knob=document.getElementById('knob');let pid;function jm(e){const r=joy.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=38,l=Math.hypot(x,y)||1,k=Math.min(1,m/l);jx=x*k/m;jy=y*k/m;knob.style.transform=`translate(${x*k}px,${y*k}px)`}joy.onpointerdown=e=>{pid=e.pointerId;joy.setPointerCapture(pid);jm(e)};joy.onpointermove=e=>{if(e.pointerId===pid)jm(e)};joy.onpointerup=joy.onpointercancel=e=>{pid=null;jx=jy=0;knob.style.transform='none'};
const clock=new THREE.Clock(),vel=new THREE.Vector3();function animate(){requestAnimationFrame(animate);const dt=Math.min(.033,clock.getDelta()),dx=keys.r-keys.l+jx,dz=keys.d-keys.u+jy;vel.x=THREE.MathUtils.lerp(vel.x,dx*2.5,1-Math.exp(-9*dt));vel.z=THREE.MathUtils.lerp(vel.z,dz*2.2,1-Math.exp(-9*dt));player.position.x=THREE.MathUtils.clamp(player.position.x+vel.x*dt,-6.7,6.75);player.position.z=THREE.MathUtils.clamp(player.position.z+vel.z*dt,-2.3,2.7);player.position.y=.12;const s=vel.length();if(mixer)mixer.update(dt);if(s>.12&&model){player.rotation.y=THREE.MathUtils.lerp(player.rotation.y,Math.atan2(vel.x,vel.z),.18);walkT+=dt*7;walk(s)}else if(model)model.position.y=THREE.MathUtils.lerp(model.position.y,baseY,.2);renderer.render(scene,camera)}animate();addEventListener('resize',()=>{fit();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
