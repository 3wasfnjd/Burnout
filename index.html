let keys={l:0,r:0,u:0,d:0},jx=0,jy=0;function press(e,v){const k=e.key.toLowerCase();if(k==='a'||k==='arrowleft')keys.l=v;if(k==='d'||k==='arrowright')keys.r=v;if(k==='w'||k==='arrowup')keys.u=v;if(k==='s'||k==='arrowdown')keys.d=v;if(v&&k==='e')go(1)}addEventListener('keydown',e=>press(e,1));addEventListener('keyup',e=>press(e,0));
const joy=document.getElementById('joy'),knob=document.getElementById('knob');let pid;function jm(e){const r=joy.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=38,l=Math.hypot(x,y)||1,k=Math.min(1,m/l);jx=x*k/m;jy=y*k/m;knob.style.transform=`translate(${x*k}px,${y*k}px)`}joy.onpointerdown=e=>{pid=e.pointerId;joy.setPointerCapture(pid);jm(e)};joy.onpointermove=e=>{if(e.pointerId===pid)jm(e)};joy.onpointerup=joy.onpointercancel=e=>{pid=null;jx=jy=0;knob.style.transform='none'};
function go(d){roomIndex=THREE.MathUtils.clamp(roomIndex+d,0,rooms.length-1);buildRoom(roomIndex)}document.getElementById('next').onclick=()=>go(1);document.getElementById('prev').onclick=()=>go(-1);buildRoom(0);
const clock=new THREE.Clock(),vel=new THREE.Vector3();function animate(){requestAnimationFrame(animate);const dt=Math.min(.033,clock.getDelta()),dx=keys.r-keys.l+jx,dz=keys.d-keys.u+jy;vel.x=THREE.MathUtils.lerp(vel.x,dx*2.5,1-Math.exp(-9*dt));vel.z=THREE.MathUtils.lerp(vel.z,dz*2.2,1-Math.exp(-9*dt));player.position.x=THREE.MathUtils.clamp(player.position.x+vel.x*dt,-6.7,6.75);player.position.z=THREE.MathUtils.clamp(player.position.z+vel.z*dt,-2.3,2.7);player.position.y=.12;const s=vel.length();if(mixer)mixer.update(dt);if(s>.12&&model){player.rotation.y=THREE.MathUtils.lerp(player.rotation.y,Math.atan2(vel.x,vel.z),.18);walkT+=dt*7;walk(s)}else if(model)model.position.y=THREE.MathUtils.lerp(model.position.y,baseY,.2);renderer.render(scene,camera)}animate();addEventListener('resize',()=>{fit();renderer.setSize(innerWidth,innerHeight)});
