const joy=document.getElementById('joy'),knob=document.getElementById('knob');let pid=null;function moveJoy(e){const r=joy.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=38,l=Math.hypot(x,y)||1,k=l>m?m/l:1;joyX=x*k/m;joyY=y*k/m;knob.style.transform=`translate(${x*k}px,${y*k}px)`}joy.onpointerdown=e=>{pid=e.pointerId;joy.setPointerCapture(pid);moveJoy(e)};joy.onpointermove=e=>{if(e.pointerId===pid)moveJoy(e)};joy.onpointerup=joy.onpointercancel=e=>{if(e.pointerId===pid){pid=null;joyX=joyY=0;knob.style.transform='translate(0,0)'}};document.getElementById('useBtn').onclick=interact;
function flash(obj,color=0x36a85a){if(!obj?.material)return;const old=obj.material.emissive?.getHex?.()??0;obj.material.emissive?.setHex(color);obj.material.emissiveIntensity=1.5;setTimeout(()=>{obj.material.emissive?.setHex(old);obj.material.emissiveIntensity=.2},260)}
function solvePanel(id,obj){if(unlocked1)return;const expected=[2,1,3];panelSeq.push(id);if(id!==expected[panelSeq.length-1]){panelSeq=[];flash(obj,0xaa3227);setStatus('ترتيب خاطئ — أُعيدت لوحة التحكم','bad');return}flash(obj,0x3a9f54);setStatus(`إشارة صحيحة ${panelSeq.length}/3`,'good');if(panelSeq.length===3){unlocked1=true;panelLamp.material.color.setHex(0x61a66f);panelLamp.material.emissive.setHex(0x2f7c43);panelLamp.material.emissiveIntensity=2.4;setStatus('تم فتح الباب — اتجه إلى الباب واضغط تفاعل','good')}}
function solveValve(id,obj){if(unlocked2)return;const expected=[1,3,2];valveSeq.push(id);valveTarget[id-1]+=Math.PI/2;if(id!==expected[valveSeq.length-1]){flash(obj,0xa33125);setStatus('تسريب ضغط! أُعيدت الشبكة للصفر','bad');valveSeq=[];needle.rotation.z=0;for(let i=0;i<3;i++)valveTarget[i]=0;return}flash(obj,0x4b9c5a);needle.rotation.z=-Math.min(1,valveSeq.length/3)*2.15;setStatus(`الضغط يرتفع — ${valveSeq.length}/3`,'good');if(valveSeq.length===3){unlocked2=true;outletLamp.material.color.setHex(0x5b9b66);outletLamp.material.emissive.setHex(0x2d7c3b);outletLamp.material.emissiveIntensity=2.8;setStatus('ضغط مستقر — تم فتح باب الغرفة الثانية','good')}}
function interact(){if(transitioning||!interaction)return;if(interaction.kind==='panel')solvePanel(interaction.id,interaction.obj);if(interaction.kind==='valve')solveValve(interaction.id,interaction.obj);if(interaction.kind==='portal')goRoom2()}
function findInteraction(){let best=null,bd=999;if(activeRoom===1&&!unlocked1){for(const b of panelButtons){const d=Math.hypot(player.position.x-b.position.x,player.position.z+2.15);if(d<bd){bd=d;best={kind:'panel',id:b.userData.id,obj:b,label:['●','▲','■'][b.userData.id-1]}}}}else if(activeRoom===1&&unlocked1){const d=Math.hypot(player.position.x-5.45,player.position.z+2.35);bd=d;best={kind:'portal',obj:door1,label:'الصعود إلى الغرفة 02'}}else if(activeRoom===2&&!unlocked2){for(let i=0;i<valveMeshes.length;i++){const b=valveMeshes[i],d=Math.hypot(player.position.x-b.position.x,player.position.z+2.1);if(d<bd){bd=d;best={kind:'valve',id:i+1,obj:b,label:`صمام ${i+1}`}}}}interaction=bd<(best?.kind==='portal'?1.35:1.05)?best:null;prompt.classList.toggle('show',!!interaction&&!transitioning);if(interaction)promptText.textContent=interaction.kind==='panel'?`اضغط ${interaction.label}`:interaction.kind==='valve'?`أدر ${interaction.label}`:interaction.label}
function goRoom2(){if(transitioning||activeRoom===2)return;transitioning=true;fade.classList.add('on');setTimeout(()=>{activeRoom=2;player.position.set(-5.8,room2Y+.2,1.7);velocity.set(0,0,0);targetCamY=room2Y+1.8;roomLabel.textContent='Underground Room 02';setStatus('شبكة الغاز: افتح الصمامات بالترتيب الصحيح');fade.classList.remove('on');setTimeout(()=>transitioning=false,500)},480)}
const clock=new THREE.Clock(),input=new THREE.Vector3(),velocity=new THREE.Vector3(),targetVel=new THREE.Vector3();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.033),x=keys.right-keys.left+joyX,z=keys.down-keys.up+joyY;input.set(x,0,z);if(input.lengthSq()>1)input.normalize();targetVel.copy(input).multiplyScalar(transitioning?0:2.75);velocity.lerp(targetVel,1-Math.exp(-(input.lengthSq()>.01?9:12)*dt));if(velocity.lengthSq()<.0007)velocity.set(0,0,0);player.position.addScaledVector(velocity,dt);player.position.x=THREE.MathUtils.clamp(player.position.x,-6.6,6.75);player.position.z=THREE.MathUtils.clamp(player.position.z,-2.35,2.75);player.position.y=activeRoom===1?.12:room2Y+.2;const s=velocity.length();if(mixer)mixer.update(dt);if(s>.12){const t=Math.atan2(velocity.x,velocity.z);let d=Math.atan2(Math.sin(t-player.rotation.y),Math.cos(t-player.rotation.y));player.rotation.y+=d*(1-Math.exp(-12*dt));walkT+=dt*(6.4+s*.7);walk(s)}else if(model)model.position.y=THREE.MathUtils.lerp(model.position.y,modelBaseY,1-Math.exp(-12*dt));for(let i=0;i<3;i++){valveTurns[i]=THREE.MathUtils.lerp(valveTurns[i],valveTarget[i],1-Math.exp(-9*dt));valveMeshes[i].rotation.z=valveTurns[i]}findInteraction();if(unlocked1&&door1.position.y<4.85)door1.position.y+=dt*2.15;if(unlocked2&&door2.position.y<room2Y+4.95)door2.position.y+=dt*2.15;controls.target.y=THREE.MathUtils.lerp(controls.target.y,targetCamY,1-Math.exp(-5*dt));controls.target.x=THREE.MathUtils.clamp(controls.target.x,-4.5,4.5);controls.target.z=THREE.MathUtils.clamp(controls.target.z,-2.8,2.8);controls.update();renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{fitCamera();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
