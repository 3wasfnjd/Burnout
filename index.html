<style>

<body>
<div id="hud"><div class="brand"><b>THE SHELTER</b><span>Underground Room 01</span></div><div id="cameraHelp">اسحب لتدوير المشهد · إصبعان للتقريب والتحريك</div><div id="prompt"><span class="key">E</span> تفاعل</div><div id="mobile"><div class="joystick" id="joy"><div class="knob" id="knob"></div></div><button class="use" id="useBtn">↟</button></div></div>
<div id="modal"><div class="card"><h2>لوحة الطوارئ</h2><p>اختر الرموز بالترتيب الصحيح.</p><div class="symbols"><button class="sym" data-v="1">●</button><button class="sym" data-v="2">▲</button><button class="sym" data-v="3">■</button></div><div id="msg">التلميح: ▲ ● ■</div><br><button id="closeBtn" class="close">إغلاق</button></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';

import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();scene.background=new THREE.Color(0x141816);scene.fog=new THREE.Fog(0x141816,24,52);
const camera=new THREE.OrthographicCamera(-10,10,6,-6,.1,100);camera.position.set(12.8,10.8,17.8);
function fitCamera(){const aspect=innerWidth/innerHeight;const desiredW=20.5,desiredH=11.2;const h=Math.max(desiredH,desiredW/aspect);const w=h*aspect;camera.left=-w/2;camera.right=w/2;camera.top=h/2;camera.bottom=-h/2;camera.updateProjectionMatrix()}fitCamera();
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.06;document.body.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.45,0);controls.enableDamping=true;controls.dampingFactor=.065;controls.enableRotate=true;controls.enableZoom=true;controls.enablePan=true;controls.screenSpacePanning=true;controls.zoomSpeed=.8;controls.rotateSpeed=.55;controls.panSpeed=.65;controls.minZoom=.72;controls.maxZoom=2.5;controls.minPolarAngle=.35;controls.maxPolarAngle=Math.PI/2.08;controls.update();
scene.add(new THREE.HemisphereLight(0xe1d6bd,0x171a18,1.25));const keyLight=new THREE.DirectionalLight(0xffe4ba,1.5);keyLight.position.set(-5,10,9);keyLight.castShadow=true;keyLight.shadow.mapSize.set(2048,2048);keyLight.shadow.camera.left=-12;keyLight.shadow.camera.right=12;keyLight.shadow.camera.top=10;keyLight.shadow.camera.bottom=-8;scene.add(keyLight);const fill=new THREE.DirectionalLight(0xbfd4c4,.65);fill.position.set(8,6,4);scene.add(fill);
const mat=(c,r=1,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const M={concrete:mat(0x64584a,.98),concrete2:mat(0x786a59,1),floor:mat(0x756858,.93),rock:mat(0x2d2b27,1),rock2:mat(0x443d34,1),wood:mat(0x68472e,1),wood2:mat(0x463126,1),metal:mat(0x4d5754,.72,.35),dark:mat(0x202422,.9,.2),rust:mat(0x76513a,1),green:mat(0x425347,1),cloth:mat(0x5e5b44,1),paper:mat(0xc8b99b,1),glow:new THREE.MeshStandardMaterial({color:0xffd6a0,emissive:0xffa447,emissiveIntensity:3.4})};
function box(w,h,d,ma,x,y,z,ry=0){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),ma);o.position.set(x,y,z);o.rotation.y=ry;o.castShadow=o.receiveShadow=true;scene.add(o);return o}
function cyl(r,h,ma,x,y,z,rz=0){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,12),ma);o.position.set(x,y,z);o.rotation.z=rz;o.castShadow=o.receiveShadow=true;scene.add(o);return o}
function rock(x,y,z,s){const o=new THREE.Mesh(new THREE.DodecahedronGeometry(s,0),Math.random()>.5?M.rock:M.rock2);o.position.set(x,y,z);o.scale.set(1.25,.7,1);o.rotation.set(Math.random(),Math.random()*3,Math.random());o.castShadow=true;scene.add(o)}
function warmLamp(x,y,z,power=8){const bulb=new THREE.Mesh(new THREE.SphereGeometry(.11,10,8),M.glow);bulb.position.set(x,y,z);scene.add(bulb);const l=new THREE.PointLight(0xffb25f,power,7,2);l.position.copy(bulb.position);scene.add(l)}
box(17.4,.55,9,M.rock,0,-.42,.15);box(17.2,5.7,.75,M.rock,0,2.33,-4.02);box(.8,5.7,9,M.rock,-8.25,2.33,.15);box(.8,5.7,9,M.rock,8.25,2.33,.15);
box(15.6,.28,7.5,M.floor,0,-.08,.12);box(15.5,5.05,.34,M.concrete,0,2.32,-3.55);box(.34,5.05,7.4,M.concrete2,-7.55,2.32,.1);box(.34,5.05,7.4,M.concrete2,7.55,2.32,.1);
for(let i=0;i<34;i++)rock(-8+Math.random()*16,5+Math.random()*.65,-3.75+(Math.random()-.5)*.7,.24+Math.random()*.42);for(let i=0;i<18;i++){rock(-8,.1+Math.random()*4.7,-3.3+Math.random()*6.8,.22+Math.random()*.32);rock(8,.1+Math.random()*4.7,-3.3+Math.random()*6.8,.22+Math.random()*.32)}for(let i=0;i<24;i++)rock(-7.7+Math.random()*15.4,-.05,3.55+(Math.random()-.5)*.7,.18+Math.random()*.3);
for(let x=-6.8;x<7;x+=1.45)for(let z=-2.7;z<3.2;z+=1.35){const slab=box(1.38,.035,1.28,Math.random()>.55?M.floor:M.concrete2,x,.1,z,(Math.random()-.5)*.018);slab.position.y=.09}
box(3.1,4.1,.46,M.dark,5.45,1.86,-3.25);const door=box(2.42,3.46,.28,M.metal,5.45,1.62,-2.97);for(let y=.35;y<3.2;y+=.65)box(1.95,.06,.05,M.dark,5.45,y,-2.79);const ring=new THREE.Mesh(new THREE.TorusGeometry(.31,.08,8,16),M.rust);ring.position.set(5.45,1.75,-2.78);scene.add(ring);box(.72,1.05,.28,M.dark,3.82,1.42,-2.94);box(.4,.23,.07,new THREE.MeshStandardMaterial({color:0x70a87a,emissive:0x3b8051,emissiveIntensity:1.7}),3.82,1.66,-2.76);warmLamp(5.45,4.02,-2.4,11);
box(3.05,.32,1.5,M.wood2,-5.25,.28,1.25);box(2.88,.2,1.38,M.cloth,-5.25,.56,1.25);box(.82,.2,1.1,M.paper,-6.15,.76,1.25);box(.16,1.2,.16,M.wood,-6.66,.56,.68);box(.16,1.2,.16,M.wood,-6.66,.56,1.82);box(.16,.82,.16,M.wood,-3.85,.39,.68);box(.16,.82,.16,M.wood,-3.85,.39,1.82);warmLamp(-6.6,.88,2,5.5);
box(3.15,.24,1.1,M.wood,-4.35,1.02,-2.55);box(.2,1.05,.2,M.wood2,-5.6,.45,-2.55);box(.2,1.05,.2,M.wood2,-3.1,.45,-2.55);box(.72,.8,.65,M.wood2,-3.25,.52,-2.48);box(.7,.1,.42,M.paper,-4.35,1.22,-2.22,-.12);warmLamp(-4.95,1.65,-2.2,7);
box(3.2,.14,.62,M.wood,-5,2.24,-3.03);box(3.2,.14,.62,M.wood,-5,3.03,-3.03);box(.13,2.15,.13,M.wood2,-6.4,2.18,-3.03);box(.13,2.15,.13,M.wood2,-3.6,2.18,-3.03);for(let i=0;i<8;i++)box(.18+Math.random()*.2,.45+Math.random()*.38,.32,M.paper,-6.05+i*.37,2.55,-2.75,(Math.random()-.5)*.15);
box(1.48,3,.75,M.metal,-1.48,1.55,-3);box(.68,2.78,.08,M.dark,-1.82,1.55,-2.59);box(.68,2.78,.08,M.dark,-1.12,1.55,-2.59);box(1,.75,.9,M.green,.65,.48,-2.75);box(.9,.58,.82,M.wood,2,.39,-2.75);
cyl(.25,4,M.rust,1.45,3.45,-3.05);cyl(.12,2.2,M.rust,2.55,3.5,-3);cyl(.12,2.4,M.rust,3.05,3.45,-3);cyl(.12,4.6,M.rust,-.35,4.28,-3.05,Math.PI/2);for(const x of [1.45,2.55,3.05]){const v=new THREE.Mesh(new THREE.TorusGeometry(.25,.055,6,12),M.rust);v.position.set(x,2.7,-2.73);v.rotation.x=Math.PI/2;scene.add(v)}
box(4.2,.035,2.45,mat(0x76503a,1),-.9,.13,.82,-.04);box(1.55,.5,1,M.wood,4.72,.3,2.65);box(.65,.5,.65,M.green,5.8,.34,2.48);warmLamp(4.65,.82,2.65,6);for(let i=0;i<18;i++)rock(-6.8+Math.random()*13.4,.15,2.7+Math.random()*.6,.055+Math.random()*.1);
for(const [x,y,s] of [[-6.7,3.1,.7],[-3,2.55,.36],[3.1,2.6,.38],[6.8,2.7,.5]]){const p=box(s,1.05*s,.025,M.paper,x,y,-3.34,(Math.random()-.5)*.05);p.rotation.z=(Math.random()-.5)*.08}
for(const [x,z] of [[-6.55,-1.9],[2.9,-2.4],[6.75,2.15]]){box(.45,.32,.45,M.wood,x,.27,z);for(let i=0;i<6;i++){const leaf=new THREE.Mesh(new THREE.ConeGeometry(.1,.6,5),M.green);leaf.position.set(x+(Math.random()-.5)*.24,.68,z+(Math.random()-.5)*.24);leaf.rotation.z=(Math.random()-.5)*.8;scene.add(leaf)}}

const player=new THREE.Group();player.position.set(-.25,.12,.55);scene.add(player);
let model=null,mixer=null,idleAction=null,modelBaseY=0,kenneyBones=null,walkT=0;
const walkAxis=new THREE.Vector3(1,0,0),walkQ=new THREE.Quaternion();
function normalizeBoneName(n){return n.toLowerCase().replace(/[^a-z]/g,'')}
function findKenneyBones(root){const b={};root.traverse(o=>{if(!o.isBone)return;const n=normalizeBoneName(o.name);if(!b.hips&&/(hips|pelvis)/.test(n))b.hips=o;if(!b.leftUpper&&/(leftupleg|leftupperleg|leftthigh)/.test(n))b.leftUpper=o;if(!b.rightUpper&&/(rightupleg|rightupperleg|rightthigh)/.test(n))b.rightUpper=o;if(!b.leftLower&&!/(up|upper|thigh)/.test(n)&&/(leftleg|leftlowerleg|leftcalf)/.test(n))b.leftLower=o;if(!b.rightLower&&!/(up|upper|thigh)/.test(n)&&/(rightleg|rightlowerleg|rightcalf)/.test(n))b.rightLower=o;if(!b.leftFoot&&/(leftfoot)/.test(n))b.leftFoot=o;if(!b.rightFoot&&/(rightfoot)/.test(n))b.rightFoot=o});if(!b.leftUpper)b.leftUpper=b.leftLower;if(!b.rightUpper)b.rightUpper=b.rightLower;return b}
function addLocalX(bone,angle){if(!bone)return;walkQ.setFromAxisAngle(walkAxis,angle);bone.quaternion.multiply(walkQ)}
function applyNativeWalk(speed){if(!kenneyBones)return;const phase=Math.sin(walkT),other=-phase;const strength=Math.min(1,speed/2.5);const stride=.38*strength;addLocalX(kenneyBones.leftUpper,phase*stride);addLocalX(kenneyBones.rightUpper,other*stride);if(kenneyBones.leftLower&&kenneyBones.leftLower!==kenneyBones.leftUpper)addLocalX(kenneyBones.leftLower,Math.max(0,-phase)*.26*strength);if(kenneyBones.rightLower&&kenneyBones.rightLower!==kenneyBones.rightUpper)addLocalX(kenneyBones.rightLower,Math.max(0,phase)*.26*strength);addLocalX(kenneyBones.leftFoot,-phase*.12*strength);addLocalX(kenneyBones.rightFoot,-other*.12*strength);if(model)model.position.y=modelBaseY+Math.abs(phase)*.022*strength}

const fbxLoader=new FBXLoader();
Promise.all([
  fbxLoader.loadAsync('./assets/kenney/characterMedium.fbx'),
  fbxLoader.loadAsync('./assets/kenney/idle.fbx'),
  new THREE.TextureLoader().loadAsync('./assets/kenney/humanMaleA.png')
]).then(([obj,idleFbx,tex])=>{
  tex.colorSpace=THREE.SRGBColorSpace;tex.flipY=true;tex.magFilter=THREE.NearestFilter;
  obj.updateMatrixWorld(true);let b=new THREE.Box3().setFromObject(obj),size=b.getSize(new THREE.Vector3());obj.scale.setScalar(2.25/Math.max(size.y,.001));obj.updateMatrixWorld(true);b=new THREE.Box3().setFromObject(obj);const center=b.getCenter(new THREE.Vector3());obj.position.x-=center.x;obj.position.y-=b.min.y;obj.position.z-=center.z;
  obj.traverse(o=>{if(o.isMesh){o.visible=true;o.frustumCulled=false;o.castShadow=true;o.receiveShadow=true;o.material=new THREE.MeshStandardMaterial({map:tex,color:0xffffff,roughness:.82,metalness:0,side:THREE.DoubleSide})}});
  player.clear();model=obj;player.add(model);modelBaseY=model.position.y;kenneyBones=findKenneyBones(model);mixer=new THREE.AnimationMixer(model);
  if(idleFbx.animations[0]){idleAction=mixer.clipAction(idleFbx.animations[0],model);idleAction.setLoop(THREE.LoopRepeat,Infinity);idleAction.play()}
}).catch(err=>console.error('Kenney character load failed',err));

const keys={up:false,down:false,left:false,right:false};let joyX=0,joyY=0,near=false,unlocked=false,puzzle=[];const prompt=document.getElementById('prompt'),modal=document.getElementById('modal'),msg=document.getElementById('msg');
function key(e,v){const k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.up=v;if(k==='s'||k==='arrowdown')keys.down=v;if(k==='a'||k==='arrowleft')keys.left=v;if(k==='d'||k==='arrowright')keys.right=v;if(v&&(k==='e'||k==='enter')&&near)openPuzzle()}addEventListener('keydown',e=>key(e,true));addEventListener('keyup',e=>key(e,false));
const joy=document.getElementById('joy'),knob=document.getElementById('knob');let pid=null;function moveJoy(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=39,l=Math.hypot(dx,dy)||1;if(l>max){dx*=max/l;dy*=max/l}joyX=dx/max;joyY=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`}joy.onpointerdown=e=>{e.stopPropagation();pid=e.pointerId;joy.setPointerCapture(pid);moveJoy(e)};joy.onpointermove=e=>{if(e.pointerId===pid)moveJoy(e)};function endJoy(e){if(e.pointerId!==pid)return;pid=null;joyX=joyY=0;knob.style.transform='translate(0,0)'}joy.onpointerup=endJoy;joy.onpointercancel=endJoy;
document.getElementById('useBtn').onclick=()=>{if(near)openPuzzle()};document.getElementById('closeBtn').onclick=()=>modal.style.display='none';document.querySelectorAll('.sym').forEach(b=>b.onclick=()=>{puzzle.push(+b.dataset.v);if(puzzle.length===3){if(puzzle.join('')==='213'){unlocked=true;msg.textContent='تم فتح الباب';setTimeout(()=>modal.style.display='none',650)}else msg.textContent='ترتيب غير صحيح';puzzle=[]}});function openPuzzle(){msg.textContent=unlocked?'الباب مفتوح بالفعل':'التلميح: ▲ ● ■';modal.style.display='grid'}
const clock=new THREE.Clock(),input=new THREE.Vector3(),velocity=new THREE.Vector3(),targetVel=new THREE.Vector3();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.033);let x=(keys.right?1:0)-(keys.left?1:0)+joyX;let z=(keys.down?1:0)-(keys.up?1:0)+joyY;input.set(x,0,z);if(input.lengthSq()>1)input.normalize();targetVel.copy(input).multiplyScalar(2.8);const accel=input.lengthSq()>.01?9:12;velocity.lerp(targetVel,1-Math.exp(-accel*dt));if(velocity.lengthSq()<.0008)velocity.set(0,0,0);player.position.addScaledVector(velocity,dt);player.position.x=THREE.MathUtils.clamp(player.position.x,-6.55,6.45);player.position.z=THREE.MathUtils.clamp(player.position.z,-2.35,2.75);const speed=velocity.length(),moving=speed>.12;
  if(mixer)mixer.update(dt);
  if(moving){const target=Math.atan2(velocity.x,velocity.z);let d=target-player.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));player.rotation.y+=d*(1-Math.exp(-12*dt));walkT+=dt*(6.4+speed*.7);applyNativeWalk(speed)}else if(model){model.position.y=THREE.MathUtils.lerp(model.position.y,modelBaseY,1-Math.exp(-12*dt))}
  near=Math.hypot(player.position.x-3.82,player.position.z+2.25)<1.35;prompt.classList.toggle('show',near);if(unlocked&&door.position.y<4.8)door.position.y+=dt*2.25;controls.target.x=THREE.MathUtils.clamp(controls.target.x,-4,4);controls.target.y=THREE.MathUtils.clamp(controls.target.y,.2,3.5);controls.target.z=THREE.MathUtils.clamp(controls.target.z,-2.8,2.8);controls.update();renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{fitCamera();renderer.setSize(innerWidth,innerHeight);controls.update()});
