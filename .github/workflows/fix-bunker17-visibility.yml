name: Fix Bunker 17 visibility
on:
  push:
    paths:
      - '.bunker17-visibility-trigger'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch lighting
        run: python3 .github/scripts/fix_bunker17_visibility.py
      - name: Check JS
        run: node --check src/bunker17.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/bunker17.js
          git diff --cached --quiet || git commit -m "Fix Bunker 17 dark scene visibility"
          git push
