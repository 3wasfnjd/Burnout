name: Unique puzzles and shelter ending
on:
  push:
    paths:
      - '.github/workflows/unique-puzzles-ending.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply game patch
        run: python3 scripts/patch_unique_puzzles.py
      - name: Verify syntax
        run: |
          node --check src/main.js
          node --check src/puzzles.js
      - name: Commit game changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/puzzles.js
          git commit -m "Give every shelter room a unique puzzle and add final escape ending" || exit 0
          git push
