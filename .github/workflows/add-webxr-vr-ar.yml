name: Add WebXR VR and AR
on:
  push:
    paths:
      - '.github/workflows/add-webxr-vr-ar.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game
        run: python3 .github/scripts/add_xr.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js game.css
          git commit -m "Add Meta Quest VR and AR WebXR modes"
          git push
