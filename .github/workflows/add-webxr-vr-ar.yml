name: Add WebXR VR and AR
on:
  push:
    paths:
      - '.github/workflows/add-webxr-vr-ar.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game for Meta Quest WebXR
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main.js')
          s=p.read_text()
          old="import * as THREE from'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{FBXLoader}from'three/addons/loaders/FBXLoader.js';import{bindPuzzles}from'./puzzles.js';"
          new=old+"import{VRButton}from'three/addons/webxr/VRButton.js';import{ARButton}from'three/addons/webxr/ARButton.js';"
          if 'VRButton' not in s:
              s=s.replace(old,new,1)
          needle="renderer.toneMappingExposure=1.42;document.body.prepend(renderer.domElement);"
          inject="""renderer.toneMappingExposure=1.42;renderer.xr.enabled=true;renderer.xr.setReferenceSpaceType('local-floor');document.body.prepend(renderer.domElement);
const desktopBg=scene.background,desktopFog=scene.fog;let xrKind='flat';const xrRig=new THREE.Group(),xrCamera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.05,90);xrRig.add(xrCamera);xrRig.position.set(0,0,2.35);scene.add(xrRig);const xrWrap=document.createElement('div');xrWrap.id='xrWrap';Object.assign(xrWrap.style,{position:'fixed',left:'50%',bottom:'14px',transform:'translateX(-50%)',display:'flex',gap:'10px',zIndex:'40'});document.body.appendChild(xrWrap);const vrBtn=VRButton.createButton(renderer,{optionalFeatures:['local-floor','bounded-floor','hand-tracking','dom-overlay'],domOverlay:{root:document.body}}),arBtn=ARButton.createButton(renderer,{optionalFeatures:['local-floor','dom-overlay'],domOverlay:{root:document.body}});for(const b of[vrBtn,arBtn]){b.style.position='static';b.style.margin='0';b.style.width='132px';b.style.height='42px';b.style.borderRadius='10px';xrWrap.appendChild(b)}
const rayGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),new THREE.Vector3(0,0,-4)]),rayMat=new THREE.LineBasicMaterial({color:0x8fe8ff});for(let i=0;i<2;i++){const c=renderer.xr.getController(i);const line=new THREE.Line(rayGeo,rayMat);line.name='xrRay';c.add(line);c.addEventListener('selectstart',()=>{try{puzzles.open()}catch(e){}});xrRig.add(c)}
renderer.xr.addEventListener('sessionstart',()=>{const ses=renderer.xr.getSession();xrKind=ses&&ses.environmentBlendMode==='opaque'?'vr':'ar';document.body.classList.add('xr-active');player.visible=false;if(xrKind==='ar'){scene.background=null;scene.fog=null;if(root){root.scale.setScalar(.32);root.position.set(0,0,-2.25)}}else{xrRig.position.set(0,0,2.35);if(root){root.scale.setScalar(1);root.position.set(0,0,0)}}});renderer.xr.addEventListener('sessionend',()=>{xrKind='flat';document.body.classList.remove('xr-active');scene.background=desktopBg;scene.fog=desktopFog;player.visible=true;if(root){root.scale.setScalar(1);root.position.set(0,0,0)}});"""
          if needle in s and 'const desktopBg=scene.background' not in s:
              s=s.replace(needle,inject,1)
          build_old="function build(i){roomIndex=i;if(root)scene.remove(root);root=new THREE.Group();scene.add(root);colliders=[];shell(i);dress(i);player.position.set(-.3,.12,1.9);syncUI()}"
          build_new="function build(i){roomIndex=i;if(root)scene.remove(root);root=new THREE.Group();scene.add(root);colliders=[];shell(i);dress(i);if(xrKind==='ar'){root.scale.setScalar(.32);root.position.set(0,0,-2.25)}player.position.set(-.3,.12,1.9);syncUI()}"
          s=s.replace(build_old,build_new,1)
          tail_old="const clock=new THREE.Clock(),vel=new THREE.Vector3();function animate(){requestAnimationFrame(animate);const modal=document.getElementById('modal');if(!modal.classList.contains('show')){const dt=Math.min(.033,clock.getDelta()),dx=keys.r-keys.l+jx,dz=keys.d-keys.u+jy;vel.x=THREE.MathUtils.lerp(vel.x,dx*2.5,1-Math.exp(-9*dt));vel.z=THREE.MathUtils.lerp(vel.z,dz*2.2,1-Math.exp(-9*dt));move(vel.x*dt,vel.z*dt);player.position.y=.12;const s=vel.length();if(mixer)mixer.update(dt);if(s>.12&&model){player.rotation.y=THREE.MathUtils.lerp(player.rotation.y,Math.atan2(vel.x,vel.z),.18);walkT+=dt*7;walk(s)}}else clock.getDelta();renderer.render(scene,camera)}build(0);animate();addEventListener('resize',()=>{fit();renderer.setSize(innerWidth,innerHeight)});"
          tail_new="""const clock=new THREE.Clock(),vel=new THREE.Vector3(),xrForward=new THREE.Vector3(),xrRight=new THREE.Vector3();function xrMove(dt){if(xrKind!=='vr')return;const ses=renderer.xr.getSession();if(!ses)return;let ax=0,ay=0;for(const src of ses.inputSources){const g=src.gamepad;if(!g)continue;const a=g.axes||[];const x=a.length>=4?a[2]:(a[0]||0),y=a.length>=4?a[3]:(a[1]||0);if(Math.abs(x)+Math.abs(y)>.12){ax=x;ay=y;break}}if(Math.abs(ax)<.12)ax=0;if(Math.abs(ay)<.12)ay=0;if(!ax&&!ay)return;xrCamera.getWorldDirection(xrForward);xrForward.y=0;xrForward.normalize();xrRight.set(xrForward.z,0,-xrForward.x);const dx=(xrRight.x*ax+xrForward.x*-ay)*2.0*dt,dz=(xrRight.z*ax+xrForward.z*-ay)*2.0*dt,nx=THREE.MathUtils.clamp(xrRig.position.x+dx,-7,6.8),nz=THREE.MathUtils.clamp(xrRig.position.z+dz,-2.55,2.75);if(!hit(nx,xrRig.position.z))xrRig.position.x=nx;if(!hit(xrRig.position.x,nz))xrRig.position.z=nz}
function animate(){const modal=document.getElementById('modal'),dt=Math.min(.033,clock.getDelta());if(renderer.xr.isPresenting){if(!modal.classList.contains('show'))xrMove(dt);if(mixer)mixer.update(dt);renderer.render(scene,xrCamera);return}if(!modal.classList.contains('show')){const dx=keys.r-keys.l+jx,dz=keys.d-keys.u+jy;vel.x=THREE.MathUtils.lerp(vel.x,dx*2.5,1-Math.exp(-9*dt));vel.z=THREE.MathUtils.lerp(vel.z,dz*2.2,1-Math.exp(-9*dt));move(vel.x*dt,vel.z*dt);player.position.y=.12;const sp=vel.length();if(mixer)mixer.update(dt);if(sp>.12&&model){player.rotation.y=THREE.MathUtils.lerp(player.rotation.y,Math.atan2(vel.x,vel.z),.18);walkT+=dt*7;walk(sp)}}renderer.render(scene,camera)}build(0);renderer.setAnimationLoop(animate);addEventListener('resize',()=>{fit();xrCamera.aspect=innerWidth/innerHeight;xrCamera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});"""
          if tail_old not in s:
              raise SystemExit('Animation tail not found; refusing unsafe patch')
          s=s.replace(tail_old,tail_new,1)
          p.write_text(s)
          css=Path('game.css');c=css.read_text();extra="\n.xr-active .joy,.xr-active .brand,.xr-active .hint{display:none!important}#xrWrap button{font-family:system-ui!important;font-weight:800!important}"
          if '#xrWrap button' not in c: css.write_text(c+extra)
          PY
      - name: Commit WebXR conversion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js game.css
          git commit -m "Add Meta Quest VR and AR WebXR modes"
          git push
