name: Upgrade Bunker 17 Lighting and Puzzles
on:
  push:
    paths:
      - '.bunker17-upgrade-trigger'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch Bunker 17
        run: python3 .github/scripts/upgrade_bunker17.py
      - name: Syntax check
        run: node --check src/bunker17.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bunker17.js bunker17.css
          git diff --cached --quiet || git commit -m 'Upgrade Bunker 17 lighting and interactive puzzles'
          git push
