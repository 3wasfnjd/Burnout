name: Add framed gallery to Shelter
on:
  push:
    paths:
      - '.github/workflows/add-gallery.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch gallery into rooms
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main.js')
          s=p.read_text()
          if "./gallery-frames.js" not in s:
              s=s.replace("import * as THREE from'three';","import * as THREE from'three';import{addRandomGallery}from'./gallery-frames.js';",1)
          old="colliders=[];shell(i);dress(i);if(xrKind==='ar')"
          new="colliders=[];shell(i);dress(i);addRandomGallery(root,i);if(xrKind==='ar')"
          if old in s:
              s=s.replace(old,new,1)
          elif "dress(i);addRandomGallery(root,i);" not in s:
              raise SystemExit('build insertion point not found')
          p.write_text(s)
          PY
      - name: Verify syntax
        run: |
          node --check src/main.js
          node --check src/gallery-frames.js
      - name: Commit gallery integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js
          git diff --cached --quiet && exit 0
          git commit -m "Display family photos in wooden frames across rooms"
          git push
