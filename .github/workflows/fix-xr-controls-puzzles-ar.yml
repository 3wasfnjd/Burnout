name: Fix Quest VR controls puzzles and AR placement
on:
  push:
    paths:
      - '.github/workflows/fix-xr-controls-puzzles-ar.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch XR gameplay
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main.js')
          s=p.read_text()

          # portrait texture is also needed by the in-headset VR jigsaw.
          first="import * as THREE from'three';"
          if "import portrait from './portrait.js';" not in s:
              s=s.replace(first, first+"import portrait from './portrait.js';", 1)

          # AR needs hit-test so the room can be placed on a real surface.
          s=s.replace(
            "ARButton.createButton(renderer,{optionalFeatures:['local-floor','dom-overlay'],domOverlay:{root:document.body}})",
            "ARButton.createButton(renderer,{requiredFeatures:['hit-test'],optionalFeatures:['local-floor','dom-overlay'],domOverlay:{root:document.body}})",1)

          # Route Quest triggers through XR-aware interaction instead of opening the DOM puzzle.
          old="const rayGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),new THREE.Vector3(0,0,-4)]),rayMat=new THREE.LineBasicMaterial({color:0x8fe8ff});for(let i=0;i<2;i++){const c=renderer.xr.getController(i);const line=new THREE.Line(rayGeo,rayMat);c.add(line);c.addEventListener('selectstart',()=>{try{puzzles.open()}catch(e){}});xrRig.add(c)}"
          new="const rayGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),new THREE.Vector3(0,0,-4)]),rayMat=new THREE.LineBasicMaterial({color:0x8fe8ff}),xrControllers=[];for(let i=0;i<2;i++){const c=renderer.xr.getController(i);xrControllers.push(c);const line=new THREE.Line(rayGeo,rayMat);c.add(line);c.addEventListener('selectstart',()=>xrSelect(c));xrRig.add(c)}"
          if old not in s:
              raise SystemExit('controller block not found')
          s=s.replace(old,new,1)

          # Replace basic XR session setup with AR reticle, placement and scale controls.
          import re
          pat=re.compile(r"renderer\.xr\.addEventListener\('sessionstart',[\s\S]*?renderer\.xr\.addEventListener\('sessionend',[\s\S]*?\}\}\);scene\.add\(new THREE\.HemisphereLight",re.M)
          repl="""const arReticle=new THREE.Mesh(new THREE.RingGeometry(.13,.18,32).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0x55ff99}));arReticle.matrixAutoUpdate=false;arReticle.visible=false;scene.add(arReticle);let arHitSource=null,arScale=.32,arPlaced=false;
const arControls=document.createElement('div');arControls.id='arControls';arControls.innerHTML='<button id=arMinus>−</button><button id=arPlace>تحديد الموقع</button><button id=arPlus>+</button>';Object.assign(arControls.style,{display:'none',position:'fixed',left:'50%',bottom:'72px',transform:'translateX(-50%)',zIndex:'60',gap:'8px',direction:'rtl'});document.body.appendChild(arControls);for(const b of arControls.querySelectorAll('button'))Object.assign(b.style,{padding:'10px 14px',borderRadius:'10px',border:'1px solid #ffffff44',background:'#101315dd',color:'#fff',fontWeight:'800'});document.getElementById('arMinus').onclick=()=>setArScale(arScale-.05);document.getElementById('arPlus').onclick=()=>setArScale(arScale+.05);document.getElementById('arPlace').onclick=()=>{arPlaced=false;arReticle.visible=false;if(root)root.visible=false};function setArScale(v){arScale=THREE.MathUtils.clamp(v,.12,.9);if(root&&xrKind==='ar')root.scale.setScalar(arScale)}
renderer.xr.addEventListener('sessionstart',async()=>{startBgm();const ses=renderer.xr.getSession();xrKind=ses&&ses.environmentBlendMode==='opaque'?'vr':'ar';document.body.classList.add('xr-active');player.visible=false;if(xrKind==='ar'){scene.background=null;scene.fog=null;arPlaced=false;arControls.style.display='flex';if(root){root.visible=false;root.scale.setScalar(arScale)}try{const viewer=await ses.requestReferenceSpace('viewer');arHitSource=await ses.requestHitTestSource({space:viewer})}catch(e){console.warn('AR hit test unavailable',e)}}else{arControls.style.display='none';xrRig.position.set(0,0,2.35);xrRig.rotation.set(0,0,0);if(root){root.visible=true;root.scale.setScalar(1);root.position.set(0,0,0);root.quaternion.identity()}}});renderer.xr.addEventListener('sessionend',()=>{xrKind='flat';document.body.classList.remove('xr-active');scene.background=desktopBg;scene.fog=desktopFog;player.visible=true;arReticle.visible=false;arHitSource=null;arControls.style.display='none';closeVrPuzzle();if(root){root.visible=true;root.scale.setScalar(1);root.position.set(0,0,0);root.quaternion.identity()}});scene.add(new THREE.HemisphereLight"""
          s,n=pat.subn(repl,s,count=1)
          if n!=1:
              raise SystemExit('session block not found')

          # In AR, new rooms inherit the current placement/scale and stay hidden until placed if needed.
          s=s.replace("if(xrKind==='ar'){root.scale.setScalar(.32);root.position.set(0,0,-2.25)}player.position.set(-.3,.12,1.9);syncUI()",
                      "if(xrKind==='ar'){root.scale.setScalar(arScale);root.visible=arPlaced}else root.visible=true;player.position.set(-.3,.12,1.9);syncUI()",1)

          # Add a real 3D puzzle board for immersive VR and external solve hook.
          marker="const puzzles=bindPuzzles({getRoom:()=>roomIndex,onSolved:()=>syncUI(),canOpen:nearDoor});function syncUI()"
          if marker not in s:
              raise SystemExit('puzzle binding marker not found')
          vr=r"""
const puzzles=bindPuzzles({getRoom:()=>roomIndex,onSolved:()=>syncUI(),canOpen:nearDoor});
let vrPuzzle=null,vrHits=[],vrState=null;const vrTypes=['blocks','pipes','valves','circuit','jigsaw','pipes','blocks','circuit','blocks','valves'];
function vrText(text,w=1024,h=256){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#111820';x.fillRect(0,0,w,h);x.fillStyle='#fff';x.font='bold 72px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(text,w/2,h/2);const t=new THREE.CanvasTexture(c);return new THREE.MeshBasicMaterial({map:t,transparent:false})}
function closeVrPuzzle(){if(!vrPuzzle)return;xrRig.remove(vrPuzzle);vrPuzzle.traverse(o=>{if(o.geometry)o.geometry.dispose?.();if(o.material){const ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach(m=>m.dispose?.())}});vrPuzzle=null;vrHits=[];vrState=null}
function vrFinish(){closeVrPuzzle();puzzles.solve?.();}
function openVrPuzzle(){if(xrKind!=='vr'||!nearDoor()||puzzles.isSolved(roomIndex))return;closeVrPuzzle();vrPuzzle=new THREE.Group();vrPuzzle.position.set(0,1.45,-1.85);xrRig.add(vrPuzzle);const back=new THREE.Mesh(new THREE.BoxGeometry(2.6,2.05,.08),new THREE.MeshStandardMaterial({color:0x141a1e,metalness:.45,roughness:.42}));back.position.z=-.08;vrPuzzle.add(back);const title=new THREE.Mesh(new THREE.PlaneGeometry(2.25,.28),vrText(`ROOM ${roomIndex+1} PUZZLE`));title.position.set(0,.82,.01);vrPuzzle.add(title);const type=vrTypes[roomIndex];vrState={type};if(type==='blocks'||type==='jigsaw'){vrState.a=[1,2,3,4,5,6,7,8,9].sort(()=>Math.random()-.5);vrState.sel=-1;drawVrGrid(type==='jigsaw')}else if(type==='pipes'){vrState.a=[0,1,3,2,1,0,2,3,0];drawVrPipes()}else if(type==='valves'){vrState.a=[0,0,0];vrState.target=[2,1,3];drawVrValves()}else{vrState.a=[0,0,0,0];vrState.target=roomIndex===7?[1,0,1,1]:[1,1,0,1];drawVrCircuit()}}
function clearVrItems(){if(!vrPuzzle)return;for(const o of [...vrPuzzle.children])if(o.userData.item){vrPuzzle.remove(o);o.traverse?.(n=>{n.geometry?.dispose?.();n.material?.dispose?.()})}vrHits=[]}
function tileMat(n,sel=false){return vrText(String(n),256,256)}
function drawVrGrid(photo=false){clearVrItems();vrState.a.forEach((v,i)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(.56,.56,.12),tileMat(v,i===vrState.sel));m.position.set((i%3-1)*.62,.36-Math.floor(i/3)*.62,.04);m.userData={item:true,idx:i,action:()=>{if(vrState.sel<0)vrState.sel=i;else if(vrState.sel===i)vrState.sel=-1;else{[vrState.a[vrState.sel],vrState.a[i]]=[vrState.a[i],vrState.a[vrState.sel]];vrState.sel=-1;if(vrState.a.every((x,j)=>x===j+1)){vrFinish();return}}drawVrGrid(photo)}};vrPuzzle.add(m);vrHits.push(m)})}
function drawVrPipes(){clearVrItems();vrState.a.forEach((r,i)=>{const g=new THREE.Group();g.position.set((i%3-1)*.62,.36-Math.floor(i/3)*.62,.08);g.rotation.z=r*Math.PI/2;g.userData={item:true,idx:i};const mat=new THREE.MeshStandardMaterial({color:0x4d8ba5,metalness:.7,roughness:.25});const p=new THREE.Mesh(new THREE.BoxGeometry(.5,.13,.12),mat);g.add(p);if(i%2){const q=new THREE.Mesh(new THREE.BoxGeometry(.13,.5,.12),mat);q.position.set(.18,.18,0);g.add(q)}g.traverse(o=>{if(o.isMesh){o.userData.action=()=>{vrState.a[i]=(vrState.a[i]+1)%4;if(vrState.a.every((x,j)=>x===(j%3===1?1:0))){vrFinish();return}drawVrPipes()};vrHits.push(o)}});vrPuzzle.add(g)})}
function drawVrValves(){clearVrItems();vrState.a.forEach((r,i)=>{const g=new THREE.Group();g.position.set((i-1)*.72,-.05,.08);g.rotation.z=r*Math.PI/2;g.userData.item=true;const ring=new THREE.Mesh(new THREE.TorusGeometry(.25,.05,12,24),new THREE.MeshStandardMaterial({color:0xb34235,metalness:.6,roughness:.3}));ring.userData.action=()=>{vrState.a[i]=(vrState.a[i]+1)%4;if(vrState.a.every((x,j)=>x===vrState.target[j])){vrFinish();return}drawVrValves()};g.add(ring);for(let k=0;k<2;k++){const b=new THREE.Mesh(new THREE.BoxGeometry(.5,.04,.05),new THREE.MeshStandardMaterial({color:0x777777,metalness:.7}));b.rotation.z=k*Math.PI/2;g.add(b)}g.traverse(o=>{if(o.isMesh){if(!o.userData.action)o.userData.action=ring.userData.action;vrHits.push(o)}});vrPuzzle.add(g)})}
function drawVrCircuit(){clearVrItems();vrState.a.forEach((v,i)=>{const g=new THREE.Group();g.position.set((i-1.5)*.55,-.05,.08);g.userData.item=true;const base=new THREE.Mesh(new THREE.BoxGeometry(.4,.8,.12),new THREE.MeshStandardMaterial({color:0x292d31,metalness:.5}));const lever=new THREE.Mesh(new THREE.BoxGeometry(.09,.43,.1),new THREE.MeshStandardMaterial({color:v?0x4fcf70:0xcf5148}));lever.position.y=v?.12:-.12;lever.rotation.z=v?-.55:.55;const act=()=>{vrState.a[i]^=1;if(vrState.a.every((x,j)=>x===vrState.target[j])){vrFinish();return}drawVrCircuit()};base.userData.action=act;lever.userData.action=act;g.add(base,lever);vrHits.push(base,lever);vrPuzzle.add(g)})}
function xrRayPick(controller){const ray=new THREE.Raycaster(),m=new THREE.Matrix4();m.identity().extractRotation(controller.matrixWorld);ray.ray.origin.setFromMatrixPosition(controller.matrixWorld);ray.ray.direction.set(0,0,-1).applyMatrix4(m).normalize();return ray.intersectObjects(vrHits,true)[0]}
function xrSelect(controller){if(xrKind==='ar'){if(arReticle.visible&&root){const pos=new THREE.Vector3(),q=new THREE.Quaternion(),sc=new THREE.Vector3();arReticle.matrix.decompose(pos,q,sc);root.position.copy(pos);root.quaternion.copy(q);root.scale.setScalar(arScale);root.visible=true;arPlaced=true}return}if(xrKind!=='vr')return;if(vrPuzzle){const h=xrRayPick(controller);if(h){let o=h.object;while(o&&!o.userData.action)o=o.parent;o?.userData.action?.()}return}if(nearDoor())openVrPuzzle()}
function syncUI()"""
          s=s.replace(marker,vr,1)

          # Replace locomotion: left stick moves, right stick snap-turns; AR right stick scales.
          pat2=re.compile(r"function xrMove\(dt\)\{[\s\S]*?\}\nfunction animate\(\)\{",re.M)
          locomotion=r"""let snapReady=true;function stickAxes(g){const a=g?.axes||[];return a.length>=4?[a[2]||0,a[3]||0]:[a[0]||0,a[1]||0]}function xrMove(dt){const ses=renderer.xr.getSession();if(!ses)return;let left=null,right=null;for(const src of ses.inputSources){if(!src.gamepad)continue;if(src.handedness==='left')left=src;if(src.handedness==='right')right=src}if(xrKind==='ar'){const [,sy]=stickAxes(right?.gamepad||left?.gamepad);if(Math.abs(sy)>.18)setArScale(arScale-sy*dt*.28);return}if(xrKind!=='vr'||vrPuzzle)return;const [ax0,ay0]=stickAxes(left?.gamepad);let ax=Math.abs(ax0)>.14?ax0:0,ay=Math.abs(ay0)>.14?ay0:0;xrCamera.getWorldDirection(xrForward);xrForward.y=0;xrForward.normalize();xrRight.set(xrForward.z,0,-xrForward.x);const dx=(xrRight.x*ax+xrForward.x*-ay)*2*dt,dz=(xrRight.z*ax+xrForward.z*-ay)*2*dt,nx=THREE.MathUtils.clamp(xrRig.position.x+dx,-7,6.8),nz=THREE.MathUtils.clamp(xrRig.position.z+dz,-2.55,2.75);if(!hit(nx,xrRig.position.z))xrRig.position.x=nx;if(!hit(xrRig.position.x,nz))xrRig.position.z=nz;const [rx]=stickAxes(right?.gamepad);if(Math.abs(rx)<.35)snapReady=true;else if(snapReady){xrRig.rotation.y-=Math.sign(rx)*Math.PI/6;snapReady=false}}
function updateArHit(frame){if(xrKind!=='ar'||!frame||!arHitSource)return;const ref=renderer.xr.getReferenceSpace(),hits=frame.getHitTestResults(arHitSource);if(hits.length){const pose=hits[0].getPose(ref);if(pose){arReticle.visible=!arPlaced;arReticle.matrix.fromArray(pose.transform.matrix)}}else arReticle.visible=false}
function animate(time,frame){"""
          s,n=pat2.subn(locomotion,s,count=1)
          if n!=1:
              raise SystemExit('xrMove/animate block not found')

          # AR hit-test must update every XR frame.
          s=s.replace("if(renderer.xr.isPresenting){if(!modal.classList.contains('show'))xrMove(dt);if(mixer)mixer.update(dt);renderer.render(scene,xrCamera);return}",
                      "if(renderer.xr.isPresenting){updateArHit(frame);if(!modal.classList.contains('show'))xrMove(dt);if(mixer)mixer.update(dt);renderer.render(scene,xrCamera);return}",1)
          p.write_text(s)

          # Expose a solve method so the in-VR board uses the same room progression and door-light state.
          pp=Path('src/puzzles.js');q=pp.read_text()
          oldret="return{open,isSolved:r=>solved[r]}"
          newret="return{open,isSolved:r=>solved[r],solve:()=>complete(),close:()=>{clean3D();modal.classList.remove('show')}}"
          if oldret not in q:
              raise SystemExit('puzzles return marker not found')
          q=q.replace(oldret,newret,1)
          pp.write_text(q)
          PY
      - name: Commit Quest XR fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/puzzles.js
          git commit -m "Fix Quest VR controls add in-headset puzzles and AR placement controls"
          git push
