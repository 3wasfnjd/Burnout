name: Patch Bunker 17 character and audio

on:
  push:
    paths:
      - 'tools/patch_bunker17_character_audio.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Bunker 17
        run: python tools/patch_bunker17_character_audio.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bunker17.js
          git commit -m "Restore Bunker 17 character and music"
          git push
