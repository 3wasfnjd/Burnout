name: Premium Room1 Direct
"on":
  push:
    branches:
      - main
    paths:
      - .github/triggers/premium-room1-direct.txt
permissions:
  contents: write
jobs:
  build-room1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download assets and patch room 1
        run: python3 .github/scripts/premium_room1_direct.py
      - name: Verify JavaScript
        run: node --check src/main.js
      - name: Commit room 1 conversion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js assets/vendor/polyhaven
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Convert room 1 to imported premium 3D models'
          git push
