name: Remove fallback overlap

on:
  push:
    paths:
      - '.github/workflows/remove-fallback-overlap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch fallback behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="fallbackBoy();\nconst fbxLoader=new FBXLoader();"
          new="const fbxLoader=new FBXLoader();"
          if old not in s:
              raise SystemExit('fallback startup marker not found')
          s=s.replace(old,new,1)

          old2="fbxLoader.load('./assets/kenney/characterMedium.fbx',obj=>{"
          new2="fbxLoader.load('./assets/kenney/characterMedium.fbx',obj=>{"
          if old2 not in s:
              raise SystemExit('FBX loader marker not found')

          # Replace silent error callback with a fallback only on actual load failure.
          old3="},undefined,()=>{});"
          new3="},undefined,()=>{if(!model)fallbackBoy()});"
          if old3 not in s:
              raise SystemExit('FBX error callback marker not found')
          s=s.replace(old3,new3,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Remove default character overlap during Kenney load'
            git push
          fi
