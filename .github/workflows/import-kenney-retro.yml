name: Import Kenney Animated Character

on:
  push:
    paths:
      - '.github/workflows/import-kenney-retro.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Kenney Animated Characters Retro
        run: |
          set -e
          curl -L --fail --retry 3 \
            'https://kenney.nl/media/pages/assets/animated-characters-retro/93305a3c49-1774772819/kenney_animated-characters-retro.zip' \
            -o /tmp/kenney.zip
          rm -rf /tmp/kenney
          mkdir -p /tmp/kenney
          unzip -q /tmp/kenney.zip -d /tmp/kenney

      - name: Copy game-ready assets
        run: |
          set -e
          mkdir -p assets/kenney
          cp '/tmp/kenney/Model/characterMedium.fbx' assets/kenney/characterMedium.fbx
          cp '/tmp/kenney/Animations/idle.fbx' assets/kenney/idle.fbx
          cp '/tmp/kenney/Animations/run.fbx' assets/kenney/run.fbx
          cp '/tmp/kenney/Animations/jump.fbx' assets/kenney/jump.fbx
          cp '/tmp/kenney/Skins/humanMaleA.png' assets/kenney/humanMaleA.png
          cp '/tmp/kenney/License.txt' assets/kenney/License.txt

      - name: Commit imported assets
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/kenney
          if git diff --cached --quiet; then
            echo 'Assets already up to date.'
          else
            git commit -m 'Import Kenney animated character assets'
            git push
          fi
