name: Fix Bunker 17 black screen
on:
  push:
    paths:
      - '.bunker17-camera-fix-trigger'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix initial camera direction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/bunker17.js')
          s=p.read_text()
          old="let yaw=Math.PI, pitch=-.05, dragging=false, lx=0,ly=0;"
          new="let yaw=0, pitch=-.05, dragging=false, lx=0,ly=0;"
          if old not in s:
              raise SystemExit('camera yaw pattern not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check src/bunker17.js
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bunker17.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Bunker 17 initial camera direction'
          git push
