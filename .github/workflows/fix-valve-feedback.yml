name: Sync puzzle modes and AR player
on:
  push:
    paths:
      - '.github/workflows/fix-valve-feedback.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cross-mode puzzle and AR fixes
        run: python3 .github/scripts/sync_modes.py
      - name: Verify syntax
        run: |
          node --check src/main.js
          node --check src/puzzles.js
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/puzzles.js
          git commit -m "Sync puzzle feedback across modes and fix AR character" || exit 0
          git push
