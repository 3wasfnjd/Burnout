name: Fix valve puzzle feedback
on:
  push:
    paths:
      - '.github/workflows/fix-valve-feedback.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve room 3 valve feedback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Flat/mobile puzzle: make each 90-degree step visually obvious and show a counter.
          p=Path('src/puzzles.js')
          s=p.read_text()
          pat=re.compile(r" function valves\(\)\{.*?\}\n function circuit\(\)",re.S)
          repl=r''' function valves(){let a=[0,0,0],target=[2,1,3];const draw=()=>stage((s,h)=>{a.forEach((v,i)=>{const g=new THREE.Group();g.userData.idx=i;g.position.x=(i-1)*2.5;g.rotation.z=v*Math.PI/2;const ring=new THREE.Mesh(new THREE.TorusGeometry(.75,.14,16,36),new THREE.MeshStandardMaterial({color:0xb34235,metalness:.6,roughness:.3}));ring.userData.idx=i;g.add(ring);for(let k=0;k<4;k++){const sp=new THREE.Mesh(new THREE.BoxGeometry(1.25,.11,.12),metal());sp.rotation.z=k*Math.PI/2;sp.userData.idx=i;g.add(sp)}const marker=new THREE.Mesh(new THREE.SphereGeometry(.16,16,12),new THREE.MeshStandardMaterial({color:0xffd447,emissive:0x8a5c00,emissiveIntensity:2.5}));marker.position.set(0,.72,.16);marker.userData.idx=i;g.add(marker);const hub=new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,.25,18),metal());hub.rotation.x=Math.PI/2;hub.userData.idx=i;g.add(hub);s.add(g);g.traverse(o=>{if(o.isMesh)h.push(o)})})},i=>{a[i]=(a[i]+1)%4;status.textContent=`الصمام ${i+1}: ${a[i]}/4`;status.className='status';if(a.every((x,j)=>x===target[j])){complete();return}draw()});draw()}
 function circuit()'''
          s,n=pat.subn(repl,s,count=1)
          if n!=1: raise SystemExit('puzzles valves block not found')
          p.write_text(s)

          # VR puzzle: same visible yellow marker; each trigger rotates a clearly asymmetric wheel.
          p=Path('src/main.js')
          s=p.read_text()
          pat=re.compile(r"function drawVrValves\(\)\{.*?\}\nfunction drawVrCircuit\(\)",re.S)
          repl=r'''function drawVrValves(){clearVrItems();vrState.a.forEach((r,i)=>{const g=new THREE.Group();g.position.set((i-1)*.72,-.05,.08);g.rotation.z=r*Math.PI/2;g.userData.item=true;const ring=new THREE.Mesh(new THREE.TorusGeometry(.25,.05,12,24),new THREE.MeshStandardMaterial({color:0xb34235,metalness:.6,roughness:.3}));const act=()=>{vrState.a[i]=(vrState.a[i]+1)%4;if(vrState.a.every((x,j)=>x===vrState.target[j])){vrFinish();return}drawVrValves()};ring.userData.action=act;g.add(ring);for(let k=0;k<2;k++){const b=new THREE.Mesh(new THREE.BoxGeometry(.5,.04,.05),new THREE.MeshStandardMaterial({color:0x777777,metalness:.7}));b.rotation.z=k*Math.PI/2;b.userData.action=act;g.add(b)}const marker=new THREE.Mesh(new THREE.SphereGeometry(.055,12,8),new THREE.MeshStandardMaterial({color:0xffd447,emissive:0x8a5c00,emissiveIntensity:3}));marker.position.set(0,.23,.07);marker.userData.action=act;g.add(marker);g.traverse(o=>{if(o.isMesh)vrHits.push(o)});vrPuzzle.add(g)})}
function drawVrCircuit()'''
          s,n=pat.subn(repl,s,count=1)
          if n!=1: raise SystemExit('VR valves block not found')
          p.write_text(s)
          PY
      - name: Verify syntax
        run: |
          node --check src/main.js
          node --check src/puzzles.js
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/puzzles.js
          git commit -m "Make room 3 valve turns visibly responsive" || exit 0
          git push
