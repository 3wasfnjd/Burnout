name: Upgrade Room 1 Premium
on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/room1-premium.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Upgrade room 1 and its puzzle
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/main.js')
          s=p.read_text()
          old="if(i===0){door();box(3.2,.48,1.45,M.cloth,-5,.42,1.3,0,true);kprop('desk.glb',-4.4,.13,-2,1.1,0,true,1.5,.9);kprop('bookcaseOpen.glb',-6.3,.13,-2.35,1.05,0,true,1.1,.55);kprop('pottedPlant.glb',-6.5,.13,2.2,.95);pipeH(-.3,3.15,-2.75,4.6,.11);pipeV(1.9,2.1,-2.75,2.2,.11)}"
          new="""if(i===0){
          door();
          // Premium living quarters: use real kit assets as the visual language, not primitive furniture.
          qfit('Props/Prop_Chest.gltf',-5.85,.12,1.95,1.55,.85,.85,0,true);
          qfit('Props/Prop_Crate4.gltf',-3.95,.12,2.28,.82,.72,.82,.18,true);
          qfit('Props/Prop_Crate4.gltf',-3.05,.12,2.05,.62,.55,.62,-.12,true);
          qfit('Props/Prop_Barrel_Large.gltf',2.75,.12,2.18,.72,1.18,.72,0,true);
          qfit('Props/Prop_AccessPoint.gltf',2.72,.78,-3.0,.92,1.18,.34,0,false);
          qfit('Props/Prop_Cable_1.gltf',-.9,.12,-2.92,2.6,.38,.28,0,false);
          qfit('Props/Prop_Cable_3.gltf',-5.2,.12,-2.93,2.15,.52,.28,0,false);
          // Existing furniture is retained only where it reads as believable shelter furniture.
          kprop('desk.glb',-4.45,.13,-1.82,1.12,0,true,1.55,.92);
          kprop('bookcaseOpen.glb',-6.45,.13,-2.28,1.08,0,true,1.05,.58);
          kprop('pottedPlant.glb',-6.72,.13,2.28,.9);
          // Built-in bunk alcove, mattress, blanket and under-bed storage.
          box(3.45,.18,1.62,M.metal,-4.75,.34,.92,0,true);
          box(3.18,.30,1.43,M.cloth,-4.75,.55,.92);
          box(1.18,.08,1.18,mat(0x8b674b,.96),-5.65,.73,.92,.08);
          box(1.15,.08,1.0,mat(0x4c6872,.94),-3.95,.73,.96,-.05);
          box(.88,.23,1.15,M.dark,-6.02,.20,.92);
          box(.88,.23,1.15,M.dark,-4.93,.20,.92);
          // Workbench details: books, terminal glow, mug, task lamp and wall storage.
          for(let n=0;n<6;n++)box(.26,.06,.38,mat([0x6f4937,0x3f5d6b,0x745f38,0x5b3f61][n%4],.88),-5.15+n*.29,1.06,-1.73,(n%2?-.05:.04));
          cyl(.11,.22,mat(0x8c7b69,.75,.08),-3.73,1.13,-1.65,0);
          const screen=box(.88,.58,.08,new THREE.MeshStandardMaterial({color:0x18343d,emissive:0x39d8ff,emissiveIntensity:2.3,roughness:.28}),-4.42,1.62,-2.17);
          lamp(-4.42,1.65,-2.02,0x62dcff,1.6,2.2);
          // Wall shelves and readable clutter silhouette.
          for(const yy of[1.55,2.35]){box(2.65,.10,.42,M.metal,-6.15,yy,-2.98);for(let n=0;n<7;n++)box(.18+.05*(n%2),.38+.08*(n%3),.28,mat([0x694a37,0x53636b,0x7b693e,0x493f58][n%4],.9),-7.15+n*.34,yy+.24,-2.82,0)}
          // Ceiling services and warm practical lighting.
          pipeH(-.35,3.28,-2.82,4.9,.12);pipeV(1.98,2.22,-2.82,2.2,.12);
          pipeH(-4.95,3.55,-2.88,3.15,.08,M.dark);
          lamp(-5.2,3.25,.35,0xffb36b,3.4,4.2);lamp(.7,3.55,-1.0,0xffd29a,2.4,3.4);
          // Small candle cluster for atmosphere; emissive flames + local light.
          for(const [cx,cz,ch] of[[-2.15,1.75,.32],[-1.88,1.82,.24],[-2.0,1.55,.19]]){cyl(.055,ch,mat(0xd8c7a0,.9),cx,.15+ch/2,cz);const flame=new THREE.Mesh(new THREE.SphereGeometry(.045,8,6),new THREE.MeshStandardMaterial({color:0xffc46b,emissive:0xff7b24,emissiveIntensity:5}));flame.scale.set(.65,1.4,.65);flame.position.set(cx,.18+ch,cz);add(flame)}
          lamp(-2.02,.62,1.72,0xff8a3d,1.8,2.4);
          // Rug and floor wear break up the grid without adding expensive geometry.
          box(2.9,.025,1.72,mat(0x3f4a48,.98),-.55,.235,1.38,.04);
          }"""
          if old not in s:
              raise SystemExit('Room 1 source block not found; refusing unsafe patch')
          p.write_text(s.replace(old,new,1))

          p=Path('src/puzzles.js')
          s=p.read_text()
          start=s.index(' function blocks(){')
          end=s.index('\n function pipeModel',start)
          new_blocks=r''' function blocks(){
           // Room 1: physical shelter archive lock instead of floating numbered cubes.
           let a=shuffle([1,2,3,4,5,6,7,8,9]),sel=-1;
           const draw=()=>stage((s,h)=>{
            const steel=new THREE.MeshStandardMaterial({color:0x30363b,metalness:.72,roughness:.3});
            const brass=new THREE.MeshStandardMaterial({color:0xa97832,metalness:.72,roughness:.28});
            const panel=new THREE.Mesh(new THREE.BoxGeometry(6.7,6.2,.38),steel);panel.position.z=-.42;s.add(panel);
            const rim=new THREE.Mesh(new THREE.BoxGeometry(7.05,6.55,.18),new THREE.MeshStandardMaterial({color:0x171b1e,metalness:.8,roughness:.25}));rim.position.z=-.68;s.add(rim);
            // status lamps and title plate
            for(let k=0;k<3;k++){const l=new THREE.Mesh(new THREE.SphereGeometry(.12,12,8),new THREE.MeshStandardMaterial({color:k===0?0xff6a4a:0x5b6469,emissive:k===0?0x8b1d0d:0,emissiveIntensity:3}));l.position.set(-2.65+k*.42,2.65,-.12);s.add(l)}
            const titlePlate=new THREE.Mesh(new THREE.BoxGeometry(2.7,.42,.12),brass);titlePlate.position.set(1.45,2.65,-.12);s.add(titlePlate);
            a.forEach((v,i)=>{const x=(i%3-1)*1.85,y=(1-Math.floor(i/3))*1.72;const g=new THREE.Group();g.position.set(x,y,0);g.userData.idx=i;
             const socket=new THREE.Mesh(new THREE.CylinderGeometry(.72,.72,.28,8),steel);socket.rotation.x=Math.PI/2;socket.userData.idx=i;g.add(socket);
             const token=new THREE.Mesh(new THREE.CylinderGeometry(.58,.58,.34,10),numMat(v,i===sel));token.rotation.x=Math.PI/2;token.position.z=.18;token.userData.idx=i;g.add(token);
             const ring=new THREE.Mesh(new THREE.TorusGeometry(.66,.055,10,28),i===sel?new THREE.MeshStandardMaterial({color:0xffc45a,emissive:0xff8a22,emissiveIntensity:4}):brass);ring.position.z=.38;ring.userData.idx=i;g.add(ring);
             if(i===sel){const glow=new THREE.PointLight(0xffa33b,2.4,2.1,2);glow.position.z=.8;g.add(glow)}
             s.add(g);g.traverse(o=>{if(o.isMesh)h.push(o)})
            });
           },i=>{if(sel<0)sel=i;else if(sel===i)sel=-1;else{[a[sel],a[i]]=[a[i],a[sel]];sel=-1;if(a.every((v,j)=>v===j+1)){complete();return}}status.textContent=sel<0?'تلميح: رتّب أقراص الأرشيف من 1 إلى 9':'اختر مكانًا لتبديل القرص';status.className='status';draw()});draw()
          }'''
          p.write_text(s[:start]+new_blocks+s[end:])
          PY
      - name: Syntax checks
        run: |
          node --check src/main.js
          node --check src/puzzles.js
      - name: Commit upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js src/puzzles.js
          git diff --cached --quiet && exit 0
          git commit -m 'Upgrade room 1 to premium shelter quarters'
          git push
